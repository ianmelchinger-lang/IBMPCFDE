<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace one claim across the engagement boundary</title>
<style>
:root{--bg:#f5f3ee;--panel:#ffffff;--ink:#1b2430;--muted:#56616e;--line:#d6d1c5;--soft:#ece8de;--accent:#1d5876;--accent-ink:#ffffff;--accent-soft:#e3eef4;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#0a4fc4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
li{margin:.3rem 0}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.stephead{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.5rem}
.stepid{font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:.1rem .5rem}
.stepact{font-size:1.02rem;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid #8a8577;border-radius:6px;background:#fff;color:var(--ink);width:100%}
select:disabled{background:var(--soft);color:var(--muted)}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:#fff;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.6rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--muted);border-color:#8a8577}
.remits li{margin:.35rem 0}
.remits strong{font-weight:600}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
.scope{border-left:4px solid var(--accent);background:var(--panel);padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0}
.scope p{margin:.2rem 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.pair{grid-template-columns:1fr}.stephead{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Skill practice</p>
<h1>Trace one claim across the engagement boundary</h1>
<p id="lead"></p>
</header>

<section aria-labelledby="h-frame">
<h2 id="h-frame">What the funding covers</h2>
<div class="scope" id="scope"></div>
<h2 id="h-status">Four statuses</h2>
<dl id="statuses"></dl>
<p id="method"></p>
</section>

<section aria-labelledby="h-case">
<h2 id="h-case">What the case says</h2>
<ul id="facts"></ul>
<h3 id="remit-h"></h3>
<ul class="remits" id="remits"></ul>
</section>

<section aria-labelledby="h-trace">
<h2 id="h-trace">Trace the claim</h2>
<p class="hint" id="traceNote"></p>
<div id="steps"></div>
<div class="bar"><button type="button" class="btn" id="check">Check the boundary</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
</section>

<section id="second" class="panel" hidden aria-labelledby="h-second">
<h2 id="h-second" style="margin-top:0">Move one assumption</h2>
<p id="secondIntro"></p>
<button type="button" class="btn secondary" id="swap"></button>
<button type="button" class="btn secondary" id="restore" hidden>Restore the funded scope</button>
<p id="restoreNote" class="hint" role="status" aria-live="polite"></p>
<div id="vwrap" hidden>
<p id="vfact"></p>
<div id="vsteps"></div>
<div class="bar"><button type="button" class="btn" id="vcheck">Check these two steps</button></div>
<p id="vsummary" class="summary" role="status" aria-live="polite"></p>
</div>
</section>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All copy and keys live in this block. */
const COPY={
 lead:`A boundary lists every person, system, control and routine that a capability depends on in production. Follow one claim from receipt to determination letter. For each step, give it a status and name who operates it after go-live.`,
 funded:[
  'Funded: the drafting assistant, for North American claims.',
  'Proposed, not funded: the EU and Asia-Pacific regions, and a link to equipment condition data.'
 ],
 statuses:[
  ['delivered','Delivered by the engagement','The engagement builds or sets it up as part of the funded work.'],
  ['dependency','Client-supplied dependency','The capability relies on it, and the client provides it.'],
  ['action','Client action','The client\'s people do it as part of their own work.'],
  ['out','Out of scope','The funding does not cover it.']
 ],
 method:'Name an operator only when a remit below covers the step. When none does, choose "No role is named" to flag the step as unowned. A flagged step is an open question for the client. You do not close it by taking it on yourself, because you leave when the engagement ends.',
 facts:[
  `The assistant proposes a determination. The adjuster of record decides.`,
  `The service-contract registry, which holds the service history of a unit, belongs to the industrial side. Unit identifiers there follow a different convention from the claims system, so ${fmt(11)} percent of claims cannot be joined to the registry without a mapping table.`,
  `No monitoring alert on the assistant has a named recipient.`
 ],
 remitHead:'Who does what, as the case records it',
 roles:[
  ['sup','Claims desk supervisor','Runs the claims desk: receives incoming claims, oversees adjusters\' review of drafts, and issues determination letters.'],
  ['sen','Senior claims adjuster','Approves or amends drafts as the adjuster of record on complex claims.'],
  ['plat','AI platform owner','Runs the platform the assistant sits on: retrieval of the provisions in force and production of drafts. Holds the platform\'s records.'],
  ['stew','Data steward, policy and claims data','Decides who may read policy and claims data, and how long those records are kept.'],
  ['iam','Identity and access lead','Grants and removes access for people and service accounts.'],
  ['field','Field service operations lead','Supplies field inspection reports to the claims operation.'],
  ['desk','Service desk lead','Answers users who need help with their tools.'],
  ['dir','Claims operations director (sponsor)','Sponsors the engagement and owns the cycle-time outcome.'],
  ['arch','Enterprise architect','Sets how the subsidiary\'s systems fit together.'],
  ['eng','You, the engineer','Builds and hands over, then leaves when the engagement ends.']
 ],
 noneLabel:'No role is named: flag the step as unowned',
 naLabel:'No operator: the step is excluded',
 traceNote:'Choose both selections for each step, then check. Nothing is timed.',
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 msg:{
  idle:'Choose a status and, unless the step is out of scope, an operator.',
  statusFirst:'Ask four questions in turn: does the funding cover this step; does the engagement build it; does the capability rely on something the client provides; or do the client\'s people do it as their own work?',
  scopeFirst:'First move: compare this step with the funded scope above, then ask who does it.',
  opEng:'You leave when the engagement ends. The operator is whoever runs this step after go-live.',
  opOrphan:'Check whether any remit in the list covers this step. If none does, flag the step as unowned instead of assigning it.',
  opCovered:'A remit in the list does cover this step. Read the remits again.',
  opWrong:'That role\'s remit does not cover this step. Find the remit that does.',
  both:'Neither choice holds yet. Start with the status: ask four questions in turn: does the funding cover this step; does the engagement build it; does the capability rely on something the client provides; or do the client\'s people do it as their own work? Then find the remit that covers it.',
  nearOp:'The status is right. The operator is out of place. ',
  nearStatus:'The operator is right. The status is out of place. '
 },
 summary:{
  idle:'Choose a status and operator for every step, then check again.',
  some:'Some steps need another look. Read the notes on the marked steps, change your choices and check again.',
  all:'Every step holds. Two steps are unowned, and the boundary records them as open questions for the client, not as work for you.'
 },
 second:{
  intro:'Treat the link between equipment condition data and the claim path as funded. The boundary has to grow to match.',
  swap:'Treat the equipment condition link as funded',
  fact:'Equipment condition data comes from units under service contract. It sits on the industrial side and connects to nothing in the subsidiary today. No role in the list supplies it or runs a link to it. Reassign the changed step and the new one.',
  restoreNote:'Restored. The link is out of scope again and the boundary is back to its funded size.',
  summaryIdle:'Choose a status and operator for both steps, then check again.',
  summarySome:'One or both steps need another look. Read the notes and check again.'
 }
};

/* The claim path. status is the keyed status; ops is the keyed operator set; orphan marks a step no role covers. */
const STEPS=[
 {id:'P1',act:'Claim received',status:'action',ops:['sup'],orphan:false,
  why:'Claims staff do this in their own work, so the engagement delivers nothing here. The claims desk supervisor runs the desk.'},
 {id:'P2',act:'Provisions in force retrieved',status:'delivered',ops:['plat'],orphan:false,
  why:'The engagement builds the retrieval. The AI platform owner runs it after go-live.'},
 {id:'P3',act:'Data access granted',status:'dependency',ops:['stew','iam'],orphan:false,
  why:'The capability reads nothing until access is granted, and the client supplies that. The data steward decides who may read, and the identity and access lead grants it. Either can operate the step.'},
 {id:'P4',act:'Inspection report attached',status:'dependency',ops:['field'],orphan:false,
  why:'The draft draws on the report, so it sits in the boundary. Field service supplies it.'},
 {id:'P5',act:'Unit service history matched to policy',status:'dependency',ops:[],orphan:true,
  why:'The draft needs this match, so the step sits in the boundary as a client-supplied dependency. No remit covers it, so it is flagged. It does not go to you or to a nearby role.'},
 {id:'P6',act:'Draft produced',status:'delivered',ops:['plat'],orphan:false,
  why:'The engagement builds the drafting. The AI platform owner runs it after go-live.'},
 {id:'P7',act:'Adjuster approves or amends the draft',status:'action',ops:['sup','sen'],orphan:false,
  why:'The adjuster of record decides. The engagement delivers the draft, not the decision, so this is a client action.'},
 {id:'P8',act:'Determination letter issued',status:'action',ops:['sup'],orphan:false,
  why:'Claims staff issue the letter in their own work. The claims desk supervisor runs it.'},
 {id:'P9',act:'Draft and its inputs retained',status:'delivered',ops:['plat','stew'],orphan:false,
  why:'The engagement builds the retention. After go-live either the AI platform owner, who holds the records, or the data steward, who sets how long they are kept, can operate it.'},
 {id:'P10',act:'Quality signal reviewed',status:'delivered',ops:[],orphan:true,
  why:'The engagement delivers the signal. Someone has to read it after go-live, and no alert has a named recipient, so the step is flagged as unowned.'},
 {id:'P11',act:'User support',status:'dependency',ops:['desk'],orphan:false,
  why:'The capability relies on support the client provides. The service desk lead runs it.'},
 {id:'P12',act:'Equipment condition data linked',status:'out',ops:[],orphan:false,
  why:'The funding covers North American claims only. The link is proposed, not funded, so the boundary records an exclusion, and an exclusion has no operator.'}
];
const V12={id:'P12',act:'Equipment condition data linked',status:'delivered',ops:[],orphan:true,
  why:'If funded, the engagement would build the link, so it is delivered. No remit covers running it afterward, so it is unowned.'};
const V13={id:'P13',act:'Equipment condition data supplied to the link',status:'dependency',ops:[],orphan:true,
  why:'The link needs the data, and the client would have to supply it. No role supplies it today, so the step is unowned.'};

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.funded.forEach(function(t){$('#scope').appendChild(h('p',{text:t}));});
COPY.statuses.forEach(function(s){$('#statuses').appendChild(h('dt',{text:s[1]}));$('#statuses').appendChild(h('dd',{text:s[2]}));});
$('#method').textContent=COPY.method;
COPY.facts.forEach(function(t){$('#facts').appendChild(h('li',{text:t}));});
$('#remit-h').textContent=COPY.remitHead;
COPY.roles.forEach(function(r){$('#remits').appendChild(h('li',null,[h('strong',{text:r[1]+'. '}),r[2]]));});
$('#traceNote').textContent=COPY.traceNote;
$('#secondIntro').textContent=COPY.second.intro;
$('#swap').textContent=COPY.second.swap;
$('#vfact').textContent=COPY.second.fact;

/* Step cards */
function statusSelect(id){
  const s=h('select',{id:id});
  s.appendChild(option('','Choose a status'));
  COPY.statuses.forEach(function(x){s.appendChild(option(x[0],x[1]));});
  return s;
}
function opSelect(id){
  const s=h('select',{id:id});
  s.appendChild(option('','Choose an operator'));
  COPY.roles.forEach(function(r){s.appendChild(option(r[0],r[1]));});
  s.appendChild(option('none',COPY.noneLabel));
  const na=option('na',COPY.naLabel);
  na.disabled=true;
  s.appendChild(na);
  return s;
}
function buildCard(key,host,prefix){
  const id=key.id;
  const card=h('article',{class:'card',id:prefix+'card-'+id});
  card.appendChild(h('div',{class:'stephead'},[h('span',{class:'stepid',text:id}),h('span',{class:'stepact',text:key.act})]));
  const st=statusSelect(prefix+'st-'+id), op=opSelect(prefix+'op-'+id);
  card.appendChild(h('div',{class:'pair'},[
    h('div',{class:'field'},[h('label',{for:prefix+'st-'+id,text:'Status'}),st]),
    h('div',{class:'field'},[h('label',{for:prefix+'op-'+id,text:'Operator after go-live'}),op])
  ]));
  card.appendChild(h('div',{class:'fb',id:prefix+'fb-'+id,role:'status','aria-live':'polite'}));
  st.addEventListener('change',function(){syncOp(prefix,id);});
  host.appendChild(card);
}
function syncOp(prefix,id){
  const st=$('#'+prefix+'st-'+id), op=$('#'+prefix+'op-'+id);
  const naOpt=op.querySelector('option[value=na]');
  if(st.value==='out'){
    naOpt.disabled=false;
    op.value='na';
    op.disabled=true;
  }else{
    if(op.value==='na')op.value='';
    naOpt.disabled=true;
    if(!op.dataset.locked)op.disabled=false;
  }
}
STEPS.forEach(function(k){buildCard(k,$('#steps'),'');});
buildCard(V12,$('#vsteps'),'v-');
buildCard(V13,$('#vsteps'),'v-');

/* Keys */
function stepState(selStatus,selOp,key){
  if(!selStatus||(selStatus!=='out'&&!selOp))return {s:'idle',m:COPY.msg.idle};
  const stOk=selStatus===key.status;
  let opOk;
  if(key.status==='out')opOk=(selStatus==='out');
  else if(selStatus==='out')opOk=false;
  else if(key.orphan)opOk=(selOp==='none');
  else opOk=key.ops.indexOf(selOp)>-1;
  if(stOk&&opOk)return {s:'ok',m:key.why};
  if(key.status==='out'||selStatus==='out')return {s:'bad',m:COPY.msg.scopeFirst};
  function opMsg(){
    if(selOp==='eng')return COPY.msg.opEng;
    if(key.orphan&&selOp!=='none')return COPY.msg.opOrphan;
    if(!key.orphan&&selOp==='none')return COPY.msg.opCovered;
    return COPY.msg.opWrong;
  }
  if(stOk&&!opOk)return {s:'near',m:COPY.msg.nearOp+opMsg()};
  if(!stOk&&opOk)return {s:'near',m:COPY.msg.nearStatus+COPY.msg.statusFirst};
  return {s:'bad',m:COPY.msg.both};
}
function showFb(box,cardEl,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  if(cardEl)cardEl.className='card '+(res.s==='idle'?'':res.s);
}
function lockStep(prefix,id){
  $('#'+prefix+'st-'+id).disabled=true;
  const op=$('#'+prefix+'op-'+id);
  op.dataset.locked='1';
  op.disabled=true;
}
function unlockStep(prefix,id){
  $('#'+prefix+'st-'+id).disabled=false;
  const op=$('#'+prefix+'op-'+id);
  delete op.dataset.locked;
  op.disabled=($('#'+prefix+'st-'+id).value==='out');
}

function runCheck(keys,prefix,summaryEl,sumCopy){
  let all=true,anyIdle=false;
  keys.forEach(function(k){
    const r=stepState($('#'+prefix+'st-'+k.id).value,$('#'+prefix+'op-'+k.id).value,k);
    showFb($('#'+prefix+'fb-'+k.id),$('#'+prefix+'card-'+k.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    keys.forEach(function(k){lockStep(prefix,k.id);});
    summaryEl.textContent=sumCopy.all;
  }else{
    summaryEl.textContent=anyIdle?sumCopy.idle:sumCopy.some;
  }
  return all;
}

const baseOrphans=STEPS.filter(function(k){return k.orphan;}).length;
const variantOrphans=baseOrphans+(V12.orphan?1:0)+(V13.orphan?1:0);

$('#check').addEventListener('click',function(){
  const ok=runCheck(STEPS,'',$('#summary'),COPY.summary);
  if(ok){
    $('#check').hidden=true;
    $('#second').hidden=false;
  }
});

/* Second pass: the same instrument, with the funding changed */
$('#swap').addEventListener('click',function(){
  $('#restoreNote').textContent='';
  ['P12','P13'].forEach(function(id){
    $('#v-st-'+id).value='';
    $('#v-op-'+id).value='';
    syncOp('v-',id);
    unlockStep('v-',id);
    $('#v-fb-'+id).className='fb';
    $('#v-fb-'+id).textContent='';
    $('#v-card-'+id).className='card';
  });
  $('#vsummary').textContent='';
  $('#vcheck').hidden=false;
  $('#vwrap').hidden=false;
  $('#swap').hidden=true;
  $('#restore').hidden=false;
  $('#v-st-P12').focus();
});
$('#vcheck').addEventListener('click',function(){
  const sc={
    idle:COPY.second.summaryIdle,
    some:COPY.second.summarySome,
    all:`Both steps hold. Unowned steps in the funded boundary: ${fmt(baseOrphans)}. Unowned steps if the link were funded: ${fmt(variantOrphans)}. Widening the scope widened the ownership gap, and the new steps arrived with no owner.`
  };
  const ok=runCheck([V12,V13],'v-',$('#vsummary'),sc);
  if(ok)$('#vcheck').hidden=true;
});
$('#restore').addEventListener('click',function(){
  $('#vwrap').hidden=true;
  $('#restore').hidden=true;
  $('#swap').hidden=false;
  $('#restoreNote').textContent=COPY.second.restoreNote;
  $('#swap').focus();
});
})();
</script>
</body>
</html>

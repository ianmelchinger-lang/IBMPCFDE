<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classify what crosses in each direction</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--ink:#1b2430;--muted:#73777D;--line:#d9d3ea;--soft:#f1edfb;--accent:#8A40FC;--accent-ink:#ffffff;--accent-soft:#D6CAFE;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#0a4fc4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.card .lab{display:inline-block;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:.05rem .5rem;letter-spacing:.04em;margin-bottom:.3rem}
.dtitle{font-size:1.02rem;font-weight:600;margin:.1rem 0}
.ddesc{margin:.1rem 0 .4rem;color:var(--muted);font-size:.93rem}
.draftlabel{display:inline-block;font-size:.85rem;border:1px dashed var(--muted);border-radius:6px;padding:.05rem .5rem;margin:.1rem 0 .7rem}
.sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.2rem}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid var(--muted);border-radius:6px;background:#fff;color:var(--ink);width:100%}
select:disabled{background:var(--soft);color:var(--muted)}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:#fff;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.6rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--ink);border-color:var(--muted)}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
#second .btn{margin:.3rem .5rem .3rem 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.cols{grid-template-columns:1fr}.sel{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Skill practice</p>
<h1>Classify what crosses in each direction</h1>
<p id="lead"></p>
</header>

<section aria-labelledby="h-scheme">
<h2 id="h-scheme">The organization's scheme</h2>
<div class="panel">
<div class="cols">
<div><h3>Classification</h3><dl id="levels"></dl></div>
<div><h3>Criticality and location</h3><dl id="others"></dl></div>
</div>
</div>
</section>

<section aria-labelledby="h-work">
<h2 id="h-work">Classify the five directions</h2>
<p id="phaseNote" class="hint"></p>
<div id="cards"></div>
<div class="bar"><button type="button" class="btn" id="check">Check my classifications</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
</section>

<section id="second" class="panel" hidden aria-labelledby="h-second">
<h2 id="h-second" style="margin-top:0">Move one assumption</h2>
<p id="secondIntro"></p>
<button type="button" class="btn secondary" id="swap"></button>
<button type="button" class="btn secondary" id="restore" hidden>Restore the original query</button>
<p id="restoreNote" class="hint" role="status" aria-live="polite"></p>
<div id="vwrap" hidden>
<p class="hint" id="vnote"></p>
<div id="vcards"></div>
<div class="bar"><button type="button" class="btn" id="vcheck">Check this classification</button></div>
<p id="vsummary" class="summary" role="status" aria-live="polite"></p>
</div>
</section>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All copy and keys live in this block. */
const COPY={
 lead:`A system's label describes what the system holds. A flow's classification describes what actually crosses it, and a request carries different things from its response. Classify five directions of four connections by what each one carries, using the scheme below. The draft's label for each connection is shown so you can see where it fits and where it does not.`,
 levels:[
  ['Restricted','Personal or claim content.'],
  ['Confidential','Identifiers and business data.'],
  ['Internal','Published forms and documents.'],
  ['Public','Information released to anyone.']
 ],
 others:[
  ['Integrity','High if an altered value could change a decision. Low if it could not.'],
  ['Availability','High if work stops when the information is late or missing. Low if work carries on.'],
  ['Location','Region of the claim: stays in the region the claim belongs to. Any approved region: any region the organization has approved. A named region: only the one region the design names.']
 ],
 phase:{sort:'For each direction, choose what it carries, its classification, both criticalities and its location rule. Then check. Nothing is timed.',done:'Every classification holds. Nothing further is required here.'},
 fields:[
  ['info','What it carries'],['cls','Classification'],['integ','Integrity'],['avail','Availability'],['loc','Location rule']
 ],
 infoOpts:[
  ['lookup','A policy number and a loss date'],
  ['policy','Policy and endorsement terms for one insured'],
  ['claimhdr','Header fields for one claim'],
  ['wordings','Published coverage wordings'],
  ['events','Claim-event and determination rows'],
  ['narrative','The claim narrative'],
  ['all','Everything the source system holds']
 ],
 clsOpts:['Restricted','Confidential','Internal','Public'],
 critOpts:['High','Low'],
 locOpts:[['region','Region of the claim'],['any','Any approved region'],['named','A named region']],
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 msg:{
  idle:'Choose all five selections for this direction.',
  clsFirst:'First move: name what actually crosses in this direction. Then ask who could be harmed if it were disclosed, and match that to a level in the scheme.',
  sysLabel:'That is the draft\'s label for the whole connection. A label on the system describes what the system holds, not what this direction carries.',
  infoNear:'The classification holds. What you named as carried is out of place: name what crosses in this direction, not what the source holds.',
  infoAll:'The classification holds. A source holds more than any one direction carries, so "everything the source holds" is out of place.',
  integ:'Integrity is out of place: ask what decision could go wrong if someone changed the value in transit.',
  avail:'Availability is out of place: ask which work would stop if this arrived late or not at all.',
  loc:'The location rule is out of place: ask whether the information is tied to a claim\'s region or is free of any such tie.',
  nearHead:'The classification holds. ',
  nearMany:'Several parts are out of place: '
 },
 summary:{
  idle:'Choose all five selections for every direction, then check again.',
  some:'Some classifications need another look. Read the notes on the marked directions, change your choices and check again.',
  all:'Every direction holds. The draft\'s label fits one direction, and what actually crosses corrected the other four.'
 },
 second:{
  intro:'The coverage-rules index returned published wordings, and nothing about the claim went out with the request. Change what the request carries, then classify that direction.',
  swap:'Let the retrieval request carry the claim narrative',
  restoreNote:'Restored. The request carries form identifiers only, and this direction is not asked.',
  note:'Illustrative variant: the retrieval request carries the claim narrative so the index can match wording to the loss. It is not part of the real design.',
  idle:'Choose all five selections for this direction.',
  summary:'The same connection and the same system now give a different answer, because what the request carries changed.'
 }
};

const DIRS=[
 {id:'d1',label:'Direction A',title:'Policy data service: request out',desc:'The assistant asks the policy data service for the terms in force on a claim.',draft:'Confidential',
  key:{info:'lookup',cls:'Confidential',integ:'High',avail:'High',loc:'region'},
  why:'Confidential. The request carries identifiers only, which the scheme places at Confidential. The draft\'s label matches here, but only because the content does. Integrity is High because a changed number would fetch the wrong policy. Availability is High because without the lookup there are no policy terms. The location follows the claim, because the identifiers belong to a policyholder\'s record.'},
 {id:'d2',label:'Direction B',title:'Policy data service: response back',desc:'The policy data service answers the same request.',draft:'Confidential',
  key:{info:'policy',cls:'Restricted',integ:'High',avail:'High',loc:'region'},
  why:'Restricted. The response carries an insured\'s policy and endorsement terms, which the scheme treats as personal content. The draft\'s Confidential label came from the interface and understates it. Integrity and availability are High because the draft is built on these terms. The location follows the claim.'},
 {id:'d3',label:'Direction C',title:'Claims data service: response back',desc:'The claims data service answers a request for one claim.',draft:'Internal',
  key:{info:'claimhdr',cls:'Restricted',integ:'High',avail:'High',loc:'region'},
  why:'Restricted. A claim header is claim content. The draft\'s Internal label came from the interface and understates it. Integrity and availability are High because the draft is about this claim. The location follows the claim.'},
 {id:'d4',label:'Direction D',title:'Coverage-rules index: wordings back',desc:'The index answers a request for the wordings the draft will cite.',draft:'Restricted',
  key:{info:'wordings',cls:'Internal',integ:'High',avail:'High',loc:'any'},
  why:'Internal. The index returns published forms and holds no policyholder data, so the Restricted label inherited from the system overstates it. Availability is High because a determination letter must cite a provision, so no wordings means no draft. Integrity is High because a changed wording could cite the wrong provision. Any approved region will do, because the content has no tie to a claim\'s region.'},
 {id:'d5',label:'Direction E',title:'Lakehouse: rows back for outcome measurement',desc:'The lakehouse answers a read of the claim-event and determination tables.',draft:'Confidential',
  key:{info:'events',cls:'Restricted',integ:'Low',avail:'Low',loc:'region'},
  why:'Restricted. The rows are claim content, so the draft\'s Confidential label understates them. Availability is Low because a measurement run can wait for the next one and no draft depends on it. Integrity is Low because a changed row would not change a determination. The location follows the claim.'}
];
const VDIR={id:'vq',label:'The same index',title:'Coverage-rules index: request out, carrying the claim narrative',desc:'The assistant asks the index for wordings that match the loss, and sends the narrative to do so.',draft:'Restricted',
  key:{info:'narrative',cls:'Restricted',integ:'High',avail:'High',loc:'region'},
  why:'Restricted. If the request carries the claim narrative, the direction carries claim content, so the system\'s Restricted label fits here, though it did not fit the wordings coming back. One system now has two directions with different answers. The location follows the claim, so where the index sits now matters for this direction. Integrity is High because a changed request retrieves other wordings. Availability is High because without it nothing is cited.'};

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.levels.forEach(function(d){$('#levels').appendChild(h('dt',{text:d[0]}));$('#levels').appendChild(h('dd',{text:d[1]}));});
COPY.others.forEach(function(d){$('#others').appendChild(h('dt',{text:d[0]}));$('#others').appendChild(h('dd',{text:d[1]}));});
$('#phaseNote').textContent=COPY.phase.sort;
$('#secondIntro').textContent=COPY.second.intro;
$('#swap').textContent=COPY.second.swap;
$('#vnote').textContent=COPY.second.note;

function sel(id,prompt,pairs){
  const s=h('select',{id:id});
  s.appendChild(option('',prompt));
  pairs.forEach(function(p){s.appendChild(option(p[0],p[1]));});
  return s;
}
function field(prefix,d,key,text,s){
  return h('div',{class:'field'},[h('label',{for:key+'-'+prefix+d.id,text:text}),s]);
}
function buildCard(d,host,prefix){
  const card=h('article',{class:'card',id:'card-'+prefix+d.id});
  card.appendChild(h('span',{class:'lab',text:d.label}));
  card.appendChild(h('p',{class:'dtitle',text:d.title}));
  card.appendChild(h('p',{class:'ddesc',text:d.desc}));
  card.appendChild(h('span',{class:'draftlabel',text:'The draft labels this connection: '+d.draft}));
  const grid=h('div',{class:'sel'});
  grid.appendChild(field(prefix,d,'info','What it carries',sel('info-'+prefix+d.id,'Choose',COPY.infoOpts)));
  grid.appendChild(field(prefix,d,'cls','Classification',sel('cls-'+prefix+d.id,'Choose',COPY.clsOpts.map(function(x){return [x,x];}))));
  grid.appendChild(field(prefix,d,'integ','Integrity',sel('integ-'+prefix+d.id,'Choose',COPY.critOpts.map(function(x){return [x,x];}))));
  grid.appendChild(field(prefix,d,'avail','Availability',sel('avail-'+prefix+d.id,'Choose',COPY.critOpts.map(function(x){return [x,x];}))));
  grid.appendChild(field(prefix,d,'loc','Location rule',sel('loc-'+prefix+d.id,'Choose',COPY.locOpts)));
  card.appendChild(grid);
  card.appendChild(h('div',{class:'fb',id:'fb-'+prefix+d.id,role:'status','aria-live':'polite'}));
  host.appendChild(card);
}
DIRS.forEach(function(d){buildCard(d,$('#cards'),'');});
buildCard(VDIR,$('#vcards'),'v-');

/* Keys */
const KEYS=['info','cls','integ','avail','loc'];
function evalDir(d,prefix,idleMsg){
  const v={};
  KEYS.forEach(function(k){v[k]=$('#'+k+'-'+prefix+d.id).value;});
  if(KEYS.some(function(k){return !v[k];}))return {s:'idle',m:idleMsg};
  const k=d.key;
  if(v.cls!==k.cls){
    let m=COPY.msg.clsFirst;
    if(v.cls===d.draft)m=COPY.msg.sysLabel+' '+m;
    return {s:'bad',m:m};
  }
  const wrong=[];
  if(v.info!==k.info)wrong.push(v.info==='all'?COPY.msg.infoAll:COPY.msg.infoNear);
  const tail=[];
  if(v.integ!==k.integ)tail.push(COPY.msg.integ);
  if(v.avail!==k.avail)tail.push(COPY.msg.avail);
  if(v.loc!==k.loc)tail.push(COPY.msg.loc);
  if(!wrong.length&&!tail.length)return {s:'ok',m:d.why};
  if(wrong.length&&!tail.length)return {s:'near',m:wrong[0]};
  const named=[];
  if(v.info!==k.info)named.push('what it carries');
  if(v.integ!==k.integ)named.push('integrity');
  if(v.avail!==k.avail)named.push('availability');
  if(v.loc!==k.loc)named.push('the location rule');
  if(named.length===1)return {s:'near',m:COPY.msg.nearHead+tail.join(' ')};
  return {s:'near',m:COPY.msg.nearHead+COPY.msg.nearMany+named.join(', ')+'. '+tail.join(' ')};
}
function showFb(box,cardEl,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  if(cardEl)cardEl.className='card '+(res.s==='idle'?'':res.s);
}
function setDisabled(d,prefix,state){KEYS.forEach(function(k){$('#'+k+'-'+prefix+d.id).disabled=state;});}
function resetCard(d,prefix){
  KEYS.forEach(function(k){$('#'+k+'-'+prefix+d.id).value='';});
  $('#fb-'+prefix+d.id).className='fb';
  $('#fb-'+prefix+d.id).textContent='';
  $('#card-'+prefix+d.id).className='card';
}

$('#check').addEventListener('click',function(){
  let all=true,anyIdle=false;
  DIRS.forEach(function(d){
    const r=evalDir(d,'',COPY.msg.idle);
    showFb($('#fb-'+d.id),$('#card-'+d.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    DIRS.forEach(function(d){setDisabled(d,'',true);});
    $('#phaseNote').textContent=COPY.phase.done;
    $('#summary').textContent=COPY.summary.all;
    $('#check').hidden=true;
    $('#second').hidden=false;
  }else{
    $('#summary').textContent=anyIdle?COPY.summary.idle:COPY.summary.some;
  }
});

/* Second pass */
$('#swap').addEventListener('click',function(){
  $('#restoreNote').textContent='';
  resetCard(VDIR,'v-');
  setDisabled(VDIR,'v-',false);
  $('#vsummary').textContent='';
  $('#vcheck').hidden=false;
  $('#vwrap').hidden=false;
  $('#swap').hidden=true;
  $('#restore').hidden=false;
  $('#info-v-'+VDIR.id).focus();
});
$('#vcheck').addEventListener('click',function(){
  const r=evalDir(VDIR,'v-',COPY.second.idle);
  showFb($('#fb-v-'+VDIR.id),$('#card-v-'+VDIR.id),r);
  if(r.s==='ok'){
    setDisabled(VDIR,'v-',true);
    $('#vsummary').textContent=COPY.second.summary;
    $('#vcheck').hidden=true;
  }else{
    $('#vsummary').textContent=r.s==='idle'?COPY.second.idle:'This direction needs another look. Read the note and check again.';
  }
});
$('#restore').addEventListener('click',function(){
  $('#vwrap').hidden=true;
  $('#restore').hidden=true;
  $('#swap').hidden=false;
  $('#restoreNote').textContent=COPY.second.restoreNote;
  $('#swap').focus();
});
})();
</script>
</body>
</html>

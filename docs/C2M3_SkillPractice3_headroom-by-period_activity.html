<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the headroom in each period</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--ink:#1d2024;--muted:#73777D;--line:#d3d5d8;--soft:#f0f1f2;--accent:#8A40FC;--accent-ink:#ffffff;--accent-soft:#D6CAFE;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--focus:#4b1aa8}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.dhead{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:baseline;margin-bottom:.3rem}
.did{font-size:.8rem;font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:.1rem .5rem}
.dtitle{font-size:1.02rem;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
select,input[type=text]{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid #8d9196;border-radius:6px;background:#fff;color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
select:disabled,input[type=text]:disabled{background:var(--soft);color:var(--ink);opacity:.8}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.5rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--ink);border-color:#8d9196}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
table{border-collapse:collapse;width:100%;margin:.5rem 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
td.n,th.n{text-align:right}
.live table th,.live table td{border-color:#9a8fc4}
.radios label{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem 0;font-weight:400;font-size:1rem}
.radios input{margin-top:.35rem;width:1.05rem;height:1.05rem;accent-color:var(--accent)}
fieldset.radios{border:1px solid var(--line);border-radius:10px;background:#fff;margin:12px 0;padding:10px 14px 12px}
legend{padding:0 .4rem;font-weight:600}
.live{border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.live p{margin:.25rem 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Skill practice</p>
<h1>Find the headroom in each period</h1>
<p id="lead"></p>
</header>

<section aria-labelledby="h-terms">
<h2 id="h-terms">Four terms</h2>
<dl id="terms"></dl>
</section>

<section aria-labelledby="h-in">
<h2 id="h-in">The figures</h2>
<table id="inputs"><thead><tr><th>Figure</th><th class="n">Value</th></tr></thead><tbody></tbody></table>
<p class="hint" id="inNote"></p>
</section>

<section aria-labelledby="h-work">
<h2 id="h-work">Work the two periods</h2>
<p class="hint" id="workNote"></p>
<div id="cards"></div>
<div class="bar"><button type="button" class="btn" id="check">Check my figures</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
</section>

<section id="adjust" class="panel" hidden aria-labelledby="h-adj">
<h2 id="h-adj" style="margin-top:0">Choose the adjustment</h2>
<p id="adjNote"></p>
<div class="field"><label for="adj">Adjustment</label><select id="adj"></select></div>
<div class="bar"><button type="button" class="btn" id="acheck">Check my adjustment</button></div>
<div class="fb" id="afb" role="status" aria-live="polite"></div>
</section>

<section id="second" class="panel" hidden aria-labelledby="h-second">
<h2 id="h-second" style="margin-top:0">Move one assumption</h2>
<p id="secondIntro"></p>
<fieldset class="radios">
<legend id="evLegend"></legend>
</fieldset>
<div class="live" id="liveBox" role="status" aria-live="polite"></div>
</section>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All figures, copy and keys live in this block. The key is computed from the figures. */
const F={limitBH:40,useBH:31,limitCL:20,useCL:31,calls:3,drafts:24,retries:3};
function attempts(retries){return 1+retries;}
function demand(retries){return (F.drafts/60)*F.calls*attempts(retries);}
function headroom(limit,use){return limit-use;}
function r1(x){return Math.round(x*10)/10;}
const KEY={att:attempts(F.retries),dem:r1(demand(F.retries)),hBH:r1(headroom(F.limitBH,F.useBH)),hCL:r1(headroom(F.limitCL,F.useCL))};

const COPY={
 lead:`A request can complete only as fast as the narrowest limit on its path allows, and limits change with the calendar. A design fits when its demand, retries included, fits what remains in the period when the limit is lowest. Work out the assistant's demand and the room left in two periods, then decide what the design must do.`,
 terms:[
  ['Limit','The most requests per second an interface accepts in a period.'],
  ['Headroom','The limit minus what existing consumers already use in that period. It is what remains for new work, and it can be negative.'],
  ['Retry amplification','The extra load created when failed calls repeat. It is highest when capacity is lowest.'],
  ['Close window','The last two and first three business days of each month, when throughput on the systems of record is reduced.']
 ],
 inputs:[
  ['Aggregate limit on the interface, business hours',fmt(F.limitBH,1)+' requests per second'],
  ['Existing consumers\' peak use, business hours',fmt(F.useBH,1)+' requests per second'],
  ['Limit during the close window',fmt(F.limitCL,1)+' requests per second'],
  ['Existing consumers\' peak use, close window',fmt(F.useCL,1)+' requests per second'],
  ['Interface calls the assistant makes per draft',fmt(F.calls)],
  ['Peak drafts at full rollout, all regions',fmt(F.drafts)+' per minute'],
  ['Retry policy as designed',fmt(F.retries)+' retries per failed call, on any error, throttling included']
 ],
 inNote:'Peak demand is a planning figure for full rollout. A fit is claimed only inside that figure.',
 workNote:'Enter figures to one decimal place. Requests per second are the unit throughout. Nothing is timed.',
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 idle:'Enter or choose every item in this card.',
 num:{
  nan:'Enter a number.',
  attOk:'A failed call repeats up to three times after the first attempt, so one call can be four attempts.',
  attNear:'Three retries follow the first attempt. Count the first attempt as well.',
  attBad:'First move: count the first attempt, then add the retries the policy allows.',
  demOk:'Drafts per minute become drafts per second, times three calls, times four attempts. This is the worst case, when every call fails.',
  demNoRetry:'Retries are missing. Each failed call repeats, so the worst case counts every attempt.',
  demThree:'Three retries mean four attempts, the first plus three.',
  demPerMin:'Drafts are counted per minute and the limit is per second. Convert first.',
  demBad:'First move: convert drafts per minute to per second, multiply by the calls per draft, then by the attempts per call.',
  hOk:'The limit minus what existing consumers already use.',
  hLimit:'That is the limit. Headroom is the limit minus what existing consumers already use in the same period.',
  hSign:'Check the sign. Existing use is above the limit, so headroom is negative.',
  hWrongPeriod:'That is the business-hours figure. The close window has a lower limit.',
  hBad:'First move: take the limit for this period and subtract existing use in the same period.'
 },
 fit:{bhOk:'Worst-case demand is below the headroom, so the assistant fits with margin to spare.',clOk:'Headroom is below zero. Existing consumers already use more than the period allows, so no assistant demand fits.',
  bhBad:'Compare worst-case demand with headroom, not with the limit. Demand is below headroom here.',clBad:'Compare worst-case demand with headroom. Headroom is below zero, so nothing fits.'},
 govOpts:[['bh','The aggregate limit, in business hours'],['cl','Close-window throughput, during the close'],['dem','The assistant\'s own demand'],['none','Neither: both periods fit']],
 govOk:'The close window has the lowest limit, and existing use already exceeds it. The close-window throughput governs the design, and not the published aggregate limit.',
 govBad:{bh:'That limit governs only where it is the narrowest. In the close window the limit is lower and existing use already exceeds it. First move: find the period when the limit is lowest.',
  dem:'Demand is what the design brings. The governing limit belongs to the interface. First move: find the period when the limit is lowest.',
  none:'The close window has no headroom, so it does not fit. First move: compute headroom for each period before judging fit.'},
 summary:{
  idle:'Complete every card, then check again.',
  some:'Some figures need another look. Read the notes on the marked cards, change your entries and check again.',
  all:'Every figure holds. The assistant fits in business hours and cannot fit at close, so the close window governs.'
 },
 adjNote:'The design cannot fit the close window as it stands. Choose what the map records. The pattern chosen earlier is not yours to change here.',
 adjs:[
  ['record','Record the close window as a period with no synchronous read capacity for the draft flows, suppress retries on throttle responses, and escalate the conflict to the pattern decision'],
  ['nominal','Record that the design fits, since the demand is under the published limit of 40'],
  ['backoff','Add backoff between retries and ride out the close'],
  ['snapshot','Switch the draft flows to the lakehouse snapshot during the close']
 ],
 adjFb:{
  record:{s:'ok',m:'The map states the gap plainly, stops the retries that add load when supply falls, and hands the conflict to the owner of the pattern decision. Fit is claimed only inside the stated demand figure.'},
  nominal:{s:'bad',m:'That checks the nominal limit. In the close window the limit is lower and existing use already exceeds it. First move: compare demand with headroom in the lowest period.'},
  backoff:{s:'bad',m:'Spacing attempts changes their timing. It does not create headroom, and the repeated attempts still land on the consumers that share the interface. First move: ask what the retries add when supply is at its lowest.'},
  snapshot:{s:'bad',m:'That quietly selects a pattern the design had already rejected for staleness. A conflict with the pattern goes to the pattern decision. First move: ask who owns that decision.'}
 },
 aIdle:'Choose an adjustment.',
 second:{
  intro:'Hold the interface limits fixed and move one fact: the retry policy. Nothing here is checked. Watch which numbers move and which do not.',
  legend:'Retries per failed call',
  opts:[[0,'None'],[1,'One'],[3,'Three, as designed']]
 }
};

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}
function num(id,label){return h('div',{class:'field'},[h('label',{for:id,text:label}),h('input',{type:'text',id:id,inputmode:'decimal',autocomplete:'off'})]);}
function yn(id,label){const s=h('select',{id:id});s.appendChild(option('','Choose'));s.appendChild(option('yes','Yes, it fits'));s.appendChild(option('no','No, it does not fit'));return h('div',{class:'field'},[h('label',{for:id,text:label}),s]);}

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.terms.forEach(function(t){$('#terms').appendChild(h('dt',{text:t[0]}));$('#terms').appendChild(h('dd',{text:t[1]}));});
COPY.inputs.forEach(function(r){$('#inputs tbody').appendChild(h('tr',null,[h('td',{text:r[0]}),h('td',{class:'n',text:r[1]})]));});
$('#inNote').textContent=COPY.inNote;
$('#workNote').textContent=COPY.workNote;
$('#adjNote').textContent=COPY.adjNote;
$('#secondIntro').textContent=COPY.second.intro;
$('#evLegend').textContent=COPY.second.legend;

function card(id,title,kids){
  const c=h('article',{class:'card',id:'card-'+id});
  c.appendChild(h('div',{class:'dhead'},[h('span',{class:'dtitle',text:title})]));
  c.appendChild(h('div',{class:'pair'},kids));
  c.appendChild(h('div',{class:'fb',id:'fb-'+id,role:'status','aria-live':'polite'}));
  $('#cards').appendChild(c);
}
card('dem','The assistant\'s worst-case demand',[num('att','Attempts per call, at most'),num('dem','Worst-case demand, in requests per second')]);
card('bh','Business hours',[num('hbh','Headroom, in requests per second'),yn('fbh','Does the assistant\'s worst-case demand fit?')]);
card('cl','Close window',[num('hcl','Headroom, in requests per second'),yn('fcl','Does the assistant\'s worst-case demand fit?')]);
(function(){
  const s=h('select',{id:'gov'});
  s.appendChild(option('','Choose'));
  COPY.govOpts.forEach(function(o){s.appendChild(option(o[0],o[1]));});
  card('gov','The governing limit',[h('div',{class:'field'},[h('label',{for:'gov',text:'Which limit sets the design?'}),s])]);
})();
$('#adj').appendChild(option('','Choose an adjustment'));
COPY.adjs.forEach(function(a){$('#adj').appendChild(option(a[0],a[1]));});

COPY.second.opts.forEach(function(o,i){
  const inp=h('input',{type:'radio',name:'retry',value:String(o[0])});
  if(o[0]===F.retries)inp.checked=true;
  $('#second fieldset').appendChild(h('label',null,[inp,h('span',{text:o[1]})]));
});
$('#second fieldset').className='radios';

function showFb(id,res){
  const box=$('#fb-'+id),cardEl=$('#card-'+id);
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  cardEl.className='card '+(res.s==='idle'?'':res.s);
}
function parse(v){
  const t=String(v).replace('−','-').replace(/,/g,'').trim();
  if(t===''||isNaN(Number(t)))return NaN;
  return Number(t);
}
function eq(a,b){return r1(a)===r1(b);}

/* Number keys with the diagnoses a wrong method produces. */
function attState(v){
  if(isNaN(v))return {s:'idle',m:COPY.num.nan};
  if(eq(v,KEY.att))return {s:'ok',m:COPY.num.attOk};
  if(eq(v,F.retries))return {s:'near',m:COPY.num.attNear};
  return {s:'bad',m:COPY.num.attBad};
}
function demState(v){
  if(isNaN(v))return {s:'idle',m:COPY.num.nan};
  if(eq(v,KEY.dem))return {s:'ok',m:COPY.num.demOk};
  if(eq(v,demand(0)))return {s:'near',m:COPY.num.demNoRetry};
  if(eq(v,(F.drafts/60)*F.calls*F.retries))return {s:'near',m:COPY.num.demThree};
  if(eq(v,F.drafts*F.calls*attempts(F.retries)))return {s:'bad',m:COPY.num.demPerMin};
  return {s:'bad',m:COPY.num.demBad};
}
function hState(v,limit,use,other){
  const key=r1(headroom(limit,use));
  if(isNaN(v))return {s:'idle',m:COPY.num.nan};
  if(eq(v,key))return {s:'ok',m:COPY.num.hOk};
  if(eq(v,limit))return {s:'near',m:COPY.num.hLimit};
  if(eq(v,-key)&&key<0)return {s:'near',m:COPY.num.hSign};
  if(eq(v,other))return {s:'bad',m:COPY.num.hWrongPeriod};
  return {s:'bad',m:COPY.num.hBad};
}
function combine(list){
  if(list.some(function(r){return r.s==='idle';}))return {s:'idle',m:COPY.idle};
  const bad=list.filter(function(r){return r.s==='bad';});
  const near=list.filter(function(r){return r.s==='near';});
  if(!bad.length&&!near.length)return {s:'ok',m:list.map(function(r){return r.m;}).join(' ')};
  if(bad.length)return {s:'bad',m:bad.concat(near).map(function(r){return r.m;}).join(' ')};
  return {s:'near',m:'The structure is right. '+near.map(function(r){return r.m;}).join(' ')};
}
function fitState(v,key,okM,badM){if(!v)return {s:'idle',m:COPY.idle};return v===key?{s:'ok',m:okM}:{s:'bad',m:badM};}

$('#check').addEventListener('click',function(){
  const att=parse($('#att').value),dem=parse($('#dem').value),hbh=parse($('#hbh').value),hcl=parse($('#hcl').value);
  const res={
   dem:combine([attState(att),demState(dem)]),
   bh:combine([hState(hbh,F.limitBH,F.useBH,KEY.hCL),fitState($('#fbh').value,'yes',COPY.fit.bhOk,COPY.fit.bhBad)]),
   cl:combine([hState(hcl,F.limitCL,F.useCL,KEY.hBH),fitState($('#fcl').value,'no',COPY.fit.clOk,COPY.fit.clBad)])
  };
  const g=$('#gov').value;
  res.gov=!g?{s:'idle',m:COPY.idle}:(g==='cl'?{s:'ok',m:COPY.govOk}:{s:'bad',m:COPY.govBad[g]});
  let all=true,anyIdle=false;
  ['dem','bh','cl','gov'].forEach(function(k){showFb(k,res[k]);if(res[k].s==='idle')anyIdle=true;if(res[k].s!=='ok')all=false;});
  if(all){
    ['att','dem','hbh','hcl','fbh','fcl','gov'].forEach(function(i){$('#'+i).disabled=true;});
    $('#summary').textContent=COPY.summary.all;
    $('#check').hidden=true;
    $('#adjust').hidden=false;
  }else{
    $('#summary').textContent=anyIdle?COPY.summary.idle:COPY.summary.some;
  }
});

$('#acheck').addEventListener('click',function(){
  const a=$('#adj').value;
  const box=$('#afb');
  box.textContent='';
  if(!a){box.className='fb idle';box.appendChild(h('span',{class:'chip',text:COPY.chip.idle}));box.appendChild(document.createTextNode(COPY.aIdle));return;}
  const r=COPY.adjFb[a];
  box.className='fb '+r.s;
  box.appendChild(h('span',{class:'chip',text:COPY.chip[r.s]}));
  box.appendChild(document.createTextNode(r.m));
  if(r.s==='ok'){
    $('#adj').disabled=true;$('#acheck').hidden=true;
    $('#second').hidden=false;
    renderLive();
  }
});

/* Second pass: the same arithmetic with the retry policy moved. */
function renderLive(){
  const rt=Number(document.querySelector('input[name=retry]:checked').value);
  const d=demand(rt);
  const hBH=headroom(F.limitBH,F.useBH);
  const hCL=headroom(F.limitCL,F.useCL);
  const total=F.useCL+d;
  const box=$('#liveBox');
  box.textContent='';
  const t=h('table');
  t.appendChild(h('tr',null,[h('th',{text:'Quantity'}),h('th',{class:'n',text:'Value'})]));
  [
   ['Attempts per call, at most',fmt(attempts(rt))],
   ['Worst-case demand, requests per second',fmt(d,1)],
   ['Business hours: headroom',fmt(hBH,1)],
   ['Business hours: headroom left after the assistant',fmt(hBH-d,1)],
   ['Close window: headroom',fmt(hCL,1)],
   ['Close window: total load on the interface, existing use plus assistant',fmt(total,1)],
   ['Close window: limit',fmt(F.limitCL,1)]
  ].forEach(function(r){t.appendChild(h('tr',null,[h('td',{text:r[0]}),h('td',{class:'n',text:r[1]})]));});
  box.appendChild(t);
  box.appendChild(h('p',{text:'At this retry policy the assistant\'s worst-case demand is '+fmt(d,1)+' requests per second, and business hours stay comfortable. The close window does not move: headroom stays '+fmt(hCL,1)+' because existing use already exceeds the limit. Every attempt the assistant adds there lands on the consumers that share the interface.'}));
}
document.querySelectorAll('input[name=retry]').forEach(function(r){r.addEventListener('change',renderLive);});
})();
</script>
</body>
</html>

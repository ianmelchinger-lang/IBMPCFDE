<head>

<style>
:root{--bg:#f6f4fa;--panel:#ffffff;--ink:#1d1a26;--muted:#73777D;--muted-ink:#5E6268;--line:#d8d3e6;--soft:#ebe8f3;--accent:#8A40FC;--accent-ink:#ffffff;--accent-soft:#D6CAFE;--accent-deep:#5B1FC4;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#5B1FC4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.kicker{margin:0 0 .3rem;color:var(--muted-ink);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
li{margin:.3rem 0}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted-ink);font-size:.92rem}
input{accent-color:var(--accent)}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid var(--muted);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
select:disabled{background:var(--soft);color:var(--muted-ink)}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:#fff;color:var(--accent-deep);border-color:var(--accent)}
.btn.small{padding:.3rem .7rem;font-size:.88rem;background:#fff;color:var(--accent-deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.5rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--muted-ink);border-color:var(--muted)}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
mark{background:var(--mark);color:var(--ink);padding:0 .15rem;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.dgwrap{width:min(1040px,calc(100vw - 32px));position:relative;left:50%;transform:translateX(-50%);margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.dgwrap svg{display:block;width:100%;min-width:900px;height:auto}
.dgcap{margin:.2rem 0 .4rem}
.dg-bound{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:8 5}
.dg-bt{font:700 12px "Segoe UI",system-ui,sans-serif;fill:var(--accent-deep)}
.dg-in{fill:#fff;stroke:var(--accent);stroke-width:1.6}
.dg-edge-box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.dg-out{fill:#f1f0f4;stroke:var(--muted);stroke-width:1.3}
.dg-t{font:600 12.5px "Segoe UI",system-ui,sans-serif;fill:var(--ink)}
.dg-s{font:400 11px "Segoe UI",system-ui,sans-serif;fill:var(--muted-ink)}
.dg-tag{font:600 11px "Segoe UI",system-ui,sans-serif;fill:var(--accent-deep)}
.dg-q{font:600 11px Consolas,"Courier New",monospace;fill:var(--ink)}
.dg-e{fill:none;stroke:var(--ink);stroke-width:1.5}
.dg-d{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}

.dg-ard{fill:var(--muted)}
.dg-l{font:600 10.5px "Segoe UI",system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.dg-ld{font:italic 400 10.5px "Segoe UI",system-ui,sans-serif;fill:var(--muted-ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}

.dg-take{font:700 13.5px "Segoe UI",system-ui,sans-serif;fill:var(--accent-deep)}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.stephead{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.5rem;flex-wrap:wrap}
.stepid{font-size:.8rem;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border-radius:6px;padding:.1rem .5rem}
.stepact{font-size:1.02rem;font-weight:600}
.src{display:grid;grid-template-columns:13.5rem 1fr;gap:.2rem .8rem;padding:.3rem .5rem;border-radius:6px;font-size:.95rem}
.src.map{background:var(--accent-soft)}
.src .sn{font-weight:600;white-space:nowrap}
.src.map .sn{color:var(--accent-deep)}
.src .nd{color:var(--muted-ink);font-style:italic}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-top:.5rem}
.trio label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
.trio select{width:100%}
.p2{border-top:1px dashed var(--muted);margin-top:.7rem;padding-top:.5rem}
.p2 h4{margin:0 0 .2rem;font-size:.95rem}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0;padding:10px 14px 12px}
legend{padding:0 .4rem;font-weight:600}
.opt{display:flex;gap:.65rem;align-items:flex-start;padding:.45rem .25rem;font-size:1rem;cursor:pointer;border-radius:6px}
.opt input{margin-top:.35rem;flex:0 0 auto;width:1.05rem;height:1.05rem}
.cons{margin:.4rem 0;padding:.5rem .7rem;border-left:4px solid var(--muted);background:var(--panel);border-radius:0 6px 6px 0;font-size:.95rem}
.cons.depart{border-left-color:var(--bad)}
.cons.match{border-left-color:var(--ok)}
.cons .cid{font-weight:700}
.scope{border-left:4px solid var(--accent);background:var(--panel);padding:10px 14px;margin:12px 0;border-radius:0 8px 8px 0}
.scope p{margin:.2rem 0}
@media (max-width:640px){.trio{grid-template-columns:1fr}.src{grid-template-columns:1fr}.src .sn{white-space:normal}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.ctl label{min-width:0;width:100%}.ctl select{width:100%}}

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All copy and keys live in this block. */
const COPY={
 lead:`A design is drawn as several views, and each view hides something. Each repeated element has to match the integration map: its name, its direction, its acting identity and the boundary it crosses. Read the eight flows. Find the views that disagree with the map, then say what disagrees and which source governs.`,
 scope:[
  'The component view draws every flow.',
  'The runtime sequence draws only what happens while a draft is produced.',
  'The trust view draws identities and boundaries.'
 ],
 defs:[
  ['Integration map','The record of every flow: its endpoints, direction, pattern and acting identity.'],
  ['Component view (SDV-01)','The parts of the design and the lines between them.'],
  ['Runtime sequence (SDV-02)','The calls made, in order, while a draft is produced.'],
  ['Trust view (SDV-03)','Who acts, as which identity, and where each boundary lies.']
 ],
 method:'A view that does not cover a flow shows "not drawn". That is an abstraction, not a disagreement. A view disagrees when something it draws differs from the map. The integration map governs flows and identities. The requirements register governs what is needed.',
 notes:{
  read:'For each flow, say whether every source agrees with the map or at least one view disagrees. Nothing is timed.',
  find:'Every reading holds. For each flow that disagrees, name the view, what disagrees and the source that governs.',
  done:'The findings hold. Nothing further is required here.'
 },
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 reading:[['agree','All sources agree with the map'],['differ','At least one view disagrees']],
 readIdle:'Choose a reading for this flow.',
 readBadAgree:'A view disagrees only when something it draws differs from the map in name, direction, acting identity or boundary. First move: compare each drawn line with the map line on those four points.',
 readBadDiffer:'Compare each drawn line with the map line on four points: name, direction, acting identity and boundary. Then ask whether something receives each line that is drawn. First move: read the lines in the order the card gives them.',
 viewOpts:[['v1','The component view (SDV-01)'],['v2','The runtime sequence (SDV-02)'],['v3','The trust view (SDV-03)']],
 whatOpts:[['path','Path or direction'],['identity','Acting identity'],['boundary','Boundary or directory'],['orphan','No component receives it']],
 govOpts:[['map','The integration map'],['register','The requirements register'],['recent','The most recent view'],['comp','The component view']],
 p2labels:{view:'Which view departs?',what:'What disagrees?',gov:'Which source governs?'},
 p2ph:{view:'Choose a view',what:'Choose what disagrees',gov:'Choose a source'},
 p2near:{
  view:'What disagrees and the governing source are right. The view that departs is out of place. Read each view\'s line against the map line and find the one that differs.',
  what:'The view and the governing source are right. What disagrees is out of place. Compare the path, the identity and the boundary in the two lines, one at a time.',
  gov:'The view and what disagrees are right. The governing source is out of place. The map governs flows and identities. The register governs what is needed. A picture does not govern the decision it draws.'
 },
 p2bad:'Two or more choices need another look. First move: read the map line, then the line of each view, and find the one name or phrase that differs.',
 p2idle:'Choose all three: the view, what disagrees and the governing source.',
 summaryRead:{
  idle:'Choose a reading for every flow, then check again.',
  some:'Some readings need another look. Read the notes on the marked flows, change your choices and check again.',
  all:'Every reading holds. Four flows disagree somewhere, and four agree wherever they are drawn.'
 },
 summaryFind:{
  idle:'Choose all three findings for every flow that disagrees, then check again.',
  some:'Some findings need another look. Read the notes on the marked flows, change your choices and check again.',
  all:'Every finding holds. In each of the four flows the integration map governs, and the view is the thing to fix.'
 },
 fixedNote:'Here is the component view with the four findings applied. Every solid line is drawn from a row of the map.',
 second:{
  intro:'The build team will work from one picture, and nothing forces it to be the map. Choose a starting picture, then read what it builds for the four flows that disagree. This is illustrative and is not keyed.',
  pickOpts:[['v1','The component view'],['v2','The runtime sequence'],['v3','The trust view'],['map','The integration map']],
  mapTail:'Every flow builds as the map says. The views are drawn from the map, so a disagreement is fixed in the view.',
  viewTail:function(n){return n===0?'':`Building from this picture reproduces its departures. ${fmt(n)} of the four flows go wrong or have no instruction, and the other views are not consulted.`;}
 }
};

/* Eight flows. a is 'agree' when every drawn line matches the map. */
const FLOWS=[
 {id:'IMAP-01',name:'Policy read',a:false,
  map:'The assistant reads policy and endorsement data through the published APIs, as svc-claims-assist, mapped to the read-only user CLMASST in the group GCLMRO.',
  v1:'The read adapter calls the API layer, which reads the policy master.',
  v2:'The read adapter calls policyInquiry as the adjuster.',
  v3:'svc-claims-assist acts on the read, mapped to CLMASST in GCLMRO.',
  key:{view:'v2',what:'identity',gov:'map'},
  ok1:'Correct. At least one view departs from the map.',
  ok2:'The runtime sequence calls policyInquiry as the adjuster. The map names svc-claims-assist, mapped to the read-only user CLMASST, and the register needs reads that are attributable and read-only. The map governs identities.'},
 {id:'IMAP-02',name:'Claim read',a:true,
  map:'The assistant reads the claim header through the published API, as svc-claims-assist, mapped to CLMASST in GCLMRO.',
  v1:'The read adapter calls the API layer, which reads the claims master.',
  v2:'The read adapter calls claimHeader as svc-claims-assist.',
  v3:'svc-claims-assist acts on the read, mapped to CLMASST in GCLMRO.',

 {id:'IMAP-03',name:'Claim-received notice',a:false,
  map:'The claims master publishes a notice on CLAIMS.EVENT.OUT. The assistant subscribes as svc-claims-assist.',
  v1:'The claims master publishes to CLAIMS.EVENT.OUT. The line ends at the queue.',
  v2:null,
  v3:'svc-claims-assist subscribes to CLAIMS.EVENT.OUT.',

  ok1:'Correct. At least one view departs from the map.',

 {id:'IMAP-04',name:'Approved determination',a:false,
  map:'The assistant puts an approved determination on CLAIMS.EVENT.IN as svc-claims-submit, mapped to CLMSUBM in GCLMAPP. An existing transaction consumes it.',

 {id:'IMAP-05',name:'Nightly policy snapshot',a:true,
  map:`A nightly batch copies the policy and endorsement tables to the lakehouse in the batch window, 22:00 to 02:00 US Central. The integration engineer owns the batch identity.`,
  v1:'The policy master feeds the policy snapshot by a nightly batch.',
  v2:null,
  v3:'The batch identity belongs to the integration engineer.',
  ok1:'Correct. The component view and the trust view agree with the map. The runtime sequence leaves the batch out, which is an abstraction, not a disagreement.'},
 {id:'IMAP-06',name:'Coverage wording retrieval',a:true,
  map:'The drafting service reads coverage wordings from the retrieval index, as svc-claims-assist.',
  v1:'The drafting service reads from the retrieval index.',
  v2:'The drafting service queries the retrieval index as svc-claims-assist.',
  v3:'svc-claims-assist reads the retrieval index inside the boundary.',
  ok1:'Correct. Every source agrees on the reader, the target and the identity.'},
 {id:'IMAP-07',name:'Adjuster requests a draft',a:false,
  map:'The adjuster signs in against the subsidiary directory. Downstream, the assistant acts as svc-claims-assist and carries the adjuster\'s identifier.',
  v1:'The adjuster review step calls the drafting service, which returns the draft.',
  v2:'The adjuster asks the drafting service for a draft. The drafting service acts as svc-claims-assist and carries the adjuster\'s identifier.',
  v3:'The adjuster signs in through the corporate identity provider.',
  key:{view:'v3',what:'boundary',gov:'map'},
  ok1:'Correct. At least one view departs from the map.',
  ok2:'The trust view signs adjusters in through the corporate identity provider, which does not cover the subsidiary. The map has them sign in against the subsidiary directory. The map governs.'},
 {id:'IMAP-08',name:'Platform logs',a:true,
  map:'The platform sends logs to the observability stack. The logs are stripped of claim content, or kept in region.',
  v1:'The drafting service sends logs to the observability stack.',

/* What each starting picture builds for the four flows that disagree. m is 'match', 'depart' or 'none'. */
const BUILD={
 v1:{name:'the component view',rows:[
  {f:'IMAP-01',m:'match',t:'The read follows the map.'},
  {f:'IMAP-03',m:'depart',t:'The notice is published and nothing receives it. No component is built for it.'},
  {f:'IMAP-04',m:'depart',t:'The publisher writes straight to the claims master. The claims master accepts writes only through existing transactions, so the write is refused.'},
  {f:'IMAP-07',m:'match',t:'The adjuster review step calls the drafting service, as the map has it.'}]},
 v2:{name:'the runtime sequence',rows:[
  {f:'IMAP-01',m:'depart',t:'The read goes out as the adjuster. The register needs reads that are attributable and read-only as the service identity.'},
  {f:'IMAP-03',m:'none',t:'Not drawn, so the builder has no instruction. The notice goes unbuilt.'},
  {f:'IMAP-04',m:'none',t:'Not drawn, so the builder has no instruction. Nothing sends the approved determination.'},
  {f:'IMAP-07',m:'match',t:'The call carries the adjuster\'s identifier as svc-claims-assist, as the map has it.'}]},
 v3:{name:'the trust view',rows:[
  {f:'IMAP-01',m:'match',t:'The read acts as svc-claims-assist, as the map has it.'},
  {f:'IMAP-03',m:'match',t:'The subscription identity is right. The view draws no component to receive the notice.'},
  {f:'IMAP-04',m:'match',t:'The message is put as svc-claims-submit, as the map has it.'},
  {f:'IMAP-07',m:'depart',t:'Adjusters sign in through the corporate identity provider, which does not cover the subsidiary, so their sign-in fails.'}]},
 map:{name:'the integration map',rows:[
  {f:'IMAP-01',m:'match',t:'The read acts as svc-claims-assist.'},
  {f:'IMAP-03',m:'match',t:'The assistant subscribes to CLAIMS.EVENT.OUT as svc-claims-assist.'},
  {f:'IMAP-04',m:'match',t:'The message goes on CLAIMS.EVENT.IN as svc-claims-submit, and an existing transaction consumes it.'},
  {f:'IMAP-07',m:'match',t:'Adjusters sign in against the subsidiary directory.'}]}
};

const SOURCES=[['map','Integration map'],['v1','Component view (SDV-01)'],['v2','Runtime sequence (SDV-02)'],['v3','Trust view (SDV-03)']];

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}
function sel(id,label,ph,opts){
  const s=h('select',{id:id,'aria-label':label});
  s.appendChild(option('',ph));
  opts.forEach(function(o){s.appendChild(option(o[0],o[1]));});
  return s;
}

let phase='read';   /* read, find, done */

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.scope.forEach(function(t){$('#scope').appendChild(h('p',{text:t}));});
COPY.defs.forEach(function(d){$('#defs').appendChild(h('dt',{text:d[0]}));$('#defs').appendChild(h('dd',{text:d[1]}));});
$('#method').textContent=COPY.method;
$('#phaseNote').textContent=COPY.notes.read;
$('#fixedNote').textContent=COPY.fixedNote;
$('#secondIntro').textContent=COPY.second.intro;

/* Cards */
FLOWS.forEach(function(f){
  const card=h('article',{class:'card',id:'card-'+f.id});
  card.appendChild(h('div',{class:'stephead'},[h('span',{class:'stepid',text:f.id}),h('span',{class:'stepact',text:f.name})]));
  SOURCES.forEach(function(s){
    const txt=(s[0]==='map')?f.map:f[s[0]];
    const row=h('div',{class:'src'+(s[0]==='map'?' map':'')});
    row.appendChild(h('span',{class:'sn',text:s[1]}));
    row.appendChild(txt===null?h('span',{class:'nd',text:'Not drawn'}):h('span',{text:txt}));
    card.appendChild(row);
  });
  card.appendChild(h('div',{class:'ctl'},[
    h('label',{for:'rd-'+f.id,text:'Your reading'}),
    sel('rd-'+f.id,'Your reading of '+f.id,'Choose a reading',COPY.reading)
  ]));
  card.appendChild(h('div',{class:'fb',id:'fb-'+f.id,role:'status'}));
  if(!f.a){
    const p2=h('div',{class:'p2',id:'p2-'+f.id});
    p2.hidden=true;
    p2.appendChild(h('h4',{text:'Locate the disagreement in '+f.id}));
    const trio=h('div',{class:'trio'});
    ['view','what','gov'].forEach(function(k){
      const opts=k==='view'?COPY.viewOpts:(k==='what'?COPY.whatOpts:COPY.govOpts);
      trio.appendChild(h('div',null,[
        h('label',{for:'p2-'+k+'-'+f.id,text:COPY.p2labels[k]}),
        sel('p2-'+k+'-'+f.id,COPY.p2labels[k]+' ('+f.id+')',COPY.p2ph[k],opts)
      ]));
    });
    p2.appendChild(trio);
    p2.appendChild(h('div',{class:'fb',id:'fb2-'+f.id,role:'status'}));
    card.appendChild(p2);
  }
  $('#cards').appendChild(card);
});

/* Second pass controls */
COPY.second.pickOpts.forEach(function(o){
  const inp=h('input',{type:'radio',name:'pick',value:o[0]});
  inp.addEventListener('change',function(){$('#show').disabled=false;});
  $('#pick').appendChild(h('label',{class:'opt'},[inp,h('span',{text:o[1]})]));
});

/* Feedback */
function showFb(box,cardEl,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  if(cardEl)cardEl.className='card '+(res.s==='idle'?'':res.s);
}

/* Keys */
function readState(selv,f){
  if(!selv)return {s:'idle',m:COPY.readIdle};
  const said=(selv==='agree');
  if(said===f.a)return {s:'ok',m:f.ok1};
  return {s:'bad',m:f.a?COPY.readBadAgree:COPY.readBadDiffer};
}
function findState(f){
  const v=$('#p2-view-'+f.id).value, w=$('#p2-what-'+f.id).value, g=$('#p2-gov-'+f.id).value;
  if(!v||!w||!g)return {s:'idle',m:COPY.p2idle};
  const wrong=[];
  if(v!==f.key.view)wrong.push('view');
  if(w!==f.key.what)wrong.push('what');
  if(g!==f.key.gov)wrong.push('gov');
  if(wrong.length===0)return {s:'ok',m:f.ok2};
  if(wrong.length===1)return {s:'near',m:COPY.p2near[wrong[0]]};
  return {s:'bad',m:COPY.p2bad};
}

function checkRead(){
  let all=true,anyIdle=false;
  FLOWS.forEach(function(f){
    const r=readState($('#rd-'+f.id).value,f);
    showFb($('#fb-'+f.id),$('#card-'+f.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    phase='find';
    FLOWS.forEach(function(f){
      $('#rd-'+f.id).disabled=true;
      if(!f.a)$('#p2-'+f.id).hidden=false;
    });
    $('#phaseNote').textContent=COPY.notes.find;
    $('#check').textContent='Check my findings';
    $('#summary').textContent=COPY.summaryRead.all;
  }else{
    $('#summary').textContent=anyIdle?COPY.summaryRead.idle:COPY.summaryRead.some;
  }
}
function checkFind(){
  let all=true,anyIdle=false;
  FLOWS.filter(function(f){return !f.a;}).forEach(function(f){
    const r=findState(f);
    showFb($('#fb2-'+f.id),$('#card-'+f.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    phase='done';
    FLOWS.filter(function(f){return !f.a;}).forEach(function(f){
      ['view','what','gov'].forEach(function(k){$('#p2-'+k+'-'+f.id).disabled=true;});
    });
    $('#phaseNote').textContent=COPY.notes.done;
    $('#check').hidden=true;
    $('#summary').textContent=COPY.summaryFind.all;
    $('#fixed').hidden=false;
    $('#second').hidden=false;
  }else{
    $('#summary').textContent=anyIdle?COPY.summaryFind.idle:COPY.summaryFind.some;
  }
}
$('#check').addEventListener('click',function(){
  if(phase==='read')checkRead();
  else if(phase==='find')checkFind();
});

/* Second pass: the same four flows, built from one chosen picture */
$('#show').addEventListener('click',function(){
  const p=document.querySelector('input[name=pick]:checked');
  if(!p)return;
  const b=BUILD[p.value];
  const host=$('#built');
  host.textContent='';
  host.appendChild(h('p',null,[h('strong',{text:'Built from '+b.name+':'})]));
  let bad=0;
  b.rows.forEach(function(r){
    if(r.m!=='match')bad++;
    host.appendChild(h('div',{class:'cons '+(r.m==='match'?'match':'depart')},[h('span',{class:'cid',text:r.f+'. '}),r.t]));
  });
  host.appendChild(h('p',{text:p.value==='map'?COPY.second.mapTail:COPY.second.viewTail(bad)}));
});
})();
</script>
</body>

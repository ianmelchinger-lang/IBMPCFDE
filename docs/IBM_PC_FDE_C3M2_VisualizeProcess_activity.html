<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assemble the connections section from problem to signal</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--ink:#1b2430;--muted:#73777D;--line:#d9d3ea;--soft:#f1edfb;--accent:#8A40FC;--accent-ink:#ffffff;--accent-soft:#D6CAFE;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#0a4fc4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0;padding:10px 14px 12px}
legend{padding:0 .4rem;font-weight:600}
.opt{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem .25rem;font-weight:400;font-size:1rem;cursor:pointer;border-radius:6px}
.opt input{margin-top:.35rem;flex:0 0 auto;width:1.05rem;height:1.05rem}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.small{padding:.3rem .7rem;font-size:.88rem;background:#fff;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.5rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--ink);border-color:var(--muted)}
ol.path{list-style:none;margin:10px 0;padding:0}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.pcard.ok{border-left:5px solid var(--ok)}
.pcard.near{border-left:5px solid var(--near)}
.pcard.bad{border-left:5px solid var(--bad)}
.pcard .zone{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pcard .ptitle{font-weight:600}
.pcard .pdesc{color:var(--muted);font-size:.93rem}
.pcard .mv{display:flex;gap:.4rem;flex-wrap:wrap}
.pcard .fb{grid-column:1 / -1;margin-top:.2rem}
li.divider{margin:14px 0;padding:6px 0;text-align:center;font-weight:700;color:var(--accent);border-top:3px solid var(--accent);border-bottom:1px dashed var(--accent);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.pcard{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Process assembly</p>
<h1>Assemble the connections section from problem to signal</h1>
<p id="lead"></p>
<dl id="terms"></dl>
</header>

<section aria-labelledby="h-problem">
<h2 id="h-problem">The problem</h2>
<fieldset id="problem"><legend id="problemLegend"></legend></fieldset>
<div class="fb" id="fb-problem" role="status" aria-live="polite"></div>
</section>

<section aria-labelledby="h-path">
<h2 id="h-path">The path</h2>
<p id="pathNote"></p>
<ol class="path" id="path"></ol>
<div class="fb" id="fb-path" role="status" aria-live="polite"></div>
</section>

<section aria-labelledby="h-signal">
<h2 id="h-signal">The signal</h2>
<fieldset id="signal"><legend id="signalLegend"></legend></fieldset>
<div class="fb" id="fb-signal" role="status" aria-live="polite"></div>
</section>

<div class="bar"><button type="button" class="btn" id="check">Check my assembly</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
<p id="live" class="sr" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All copy and keys live in this block. */
const COPY={
 lead:`A connections-and-identities section is complete when a reviewer can name each connection's directions, handling, identity, credential source and failure behavior from the section alone. Assemble the path that produces one: choose the sentence that states the problem, put the moves in the order they depend on one another, and choose the signal that shows the work succeeded.`,
 terms:[
  ['Handoff','The point where the section is complete and later work begins.'],
  ['Principal','The non-human identity a connection acts as.'],
  ['Fixed, observed, open','A field is fixed when the design sets it, observed when it has been seen working in the target space, and open when neither is true yet.']
 ],
 problemLegend:'Which sentence states the problem in operational terms?',
 problem:[
  {id:'pa',text:`All ${fmt(5)} connections pass their tests, so the section is ready to promote.`,
   whyNot:'That is the platform owner\'s reading. A passing test shows a connection resolves, and it says nothing about what the connection is allowed to do.'},
  {id:'pb',ok:true,text:`Each of the ${fmt(5)} connections resolves, but none is defined: what crosses it in each direction, under whose identity and credential, and what happens when the source does not answer are all unrecorded. A passing test would hide all three.`,
   okMsg:'The problem is a missing definition, stated as three unrecorded things. That is what the moves supply.'},
  {id:'pc',text:'The pilot credentials are too broad, so every connection needs a new credential.',
   whyNot:'A new credential is one possible repair. The problem is what the section leaves undefined, including what each connection should be allowed to do.'},
  {id:'pd',text:'Answers arrive slowly, so the timeouts and retries should be raised.',
   whyNot:'That is a guess at a cause, and the repair it names can make a throttled or refused source worse.'}
 ],
 problemFirst:'First move: look for the sentence that says what is undefined and why a passing test does not settle it, rather than a verdict, a repair or a guess at a cause.',
 pathNote:'Eleven cards, one list. The eight above the line are the moves, in the order they depend on one another. The three below the line are later work. Use the buttons to move a card up or down. One move has more than one correct place.',
 handoff:'Handoff to later work',
 signalLegend:'Which signal shows the work succeeded?',
 signal:[
  {id:'sa',text:`All ${fmt(5)} connections pass their tests in the production space.`,
   whyNot:'That shows each connection resolves, which the pilot already showed. It cannot show the connections are defined.'},
  {id:'sb',ok:true,text:'A reviewer can read each connection\'s directions, handling, principal, credential source and behavior in every source state from the section alone, and every field is marked fixed, observed or open, with no person, pasted value or unmapped exchange standing in.',
   okMsg:'The signal can be checked on the day the section is done: a reviewer reads it cold and can name every field, and each is marked with its evidence status.'},
  {id:'sc',text:`Drafts come back within ${fmt(6,1)} seconds at the 95th percentile.`,
   whyNot:'That is a result measured after the section is built and running. It cannot show the section is defined.'},
  {id:'sd',text:'No connection has produced an error in its first week.',
   whyNot:'An absence of errors says nothing about whether a failure would be bounded and observable when it came.'}
 ],
 signalFirst:'First move: ask what a reviewer could check on the day this work ends. A signal shows the work did its job, not that the system later behaves well.',
 chip:{ok:'Holds',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 moves:[
  {id:'m1',title:'Reconcile the boundary',desc:'Sort every item the platform shows into a platform connection, a neighbor\'s system or an orphan, and disposition each once.',
   why:'Holds. Everything after it works only on exchanges that belong to the section.'},
  {id:'m2',title:'Decompose each connection by direction',desc:'For each direction, name who starts it, what operation it performs and what comes back.',
   why:'Holds. Handling, grants and limits are all attached per direction.'},
  {id:'m3',title:'Attach handling to each direction',desc:'Give each direction its own classification, criticality and location. Do not inherit the system\'s label.',
   why:'Holds. Grants are bounded by classification, and failure behavior depends on criticality.'},
  {id:'m4',title:'Bind a principal to each connection',desc:'Choose a non-human identity whose grants cover the operations and nothing more.',
   why:'Holds. Grants derive from the operations and are bounded by the handling.'},
  {id:'m5',title:'Reference the credential and confirm the binding',desc:'Record where the credential lives, never its value, and confirm the binding in the production space.',
   why:'Holds. A reference resolves for a principal, and credential states feed the failure behavior.'},
  {id:'m6',title:'Record each interface\'s limits',desc:'For each limit, name the authority, the unit and where it is enforced. Send unknowns to the register.',
   why:'Holds. Limits need only the directions, so this move can sit anywhere between decomposition and failure behavior.'},
  {id:'m7',title:'Define behavior in each source state',desc:'For each way a source can fail, set the deadline, the retry rule, the outcome and the signal.',
   why:'Holds. It uses the criticality, the credential states and the recorded limits, so all three come first.'},
  {id:'m8',title:'Verify and hand on',desc:'Mark each field fixed, observed or open, and pass the open ones to whoever owns them.',
   why:'Holds. Verification checks every field, so it runs last.'}
 ],
 distractors:[
  {id:'d1',title:'Allocate the rate budget',desc:'Divide the interface\'s call allowance among its callers.'},
  {id:'d2',title:'Set vault policies and credential lifetimes',desc:'Write the access policies, authentication methods and expiry times for the credentials.'},
  {id:'d3',title:'Set monitoring thresholds and alert owners',desc:'Choose the levels that raise an alert and name who answers each one.'}
 ],
 distractorOk:'Holds. This is later work. It follows the handoff because it needs the section the moves produce.',
 premature:'Out of place. This is later work, and it needs the section the moves produce. Placed inside the path, it sets numbers before the connections are defined.',
 belongsAbove:'Out of place. This move belongs inside the path, above the handoff.',
 deps:[
  {before:'m1',after:'m2',why:'Only exchanges that belong to the section are decomposed, so reconcile the boundary first.'},
  {before:'m2',after:'m3',why:'Handling is attached per direction, so decompose by direction first.'},
  {before:'m2',after:'m4',why:'Grants derive from operations, so know each direction\'s operation first.'},
  {before:'m3',after:'m4',why:'Grants are bounded by classification, so attach handling first.'},
  {before:'m4',after:'m5',why:'A credential reference resolves for a principal, so bind the principal first.'},
  {before:'m2',after:'m6',why:'Limits are recorded per direction, so decompose by direction first.'},
  {before:'m3',after:'m7',why:'Behavior in a failed state depends on how critical the flow is, so attach handling first.'},
  {before:'m5',after:'m7',why:'Credential states are part of the behavior, so reference the credential first.'},
  {before:'m6',after:'m7',why:'Deadlines and retry bounds draw on the recorded limits, so record them first.'},
  {before:'m7',after:'m8',why:'Verification checks every field, so it runs last.'}
 ],
 pathSet:'Some cards sit on the wrong side of the handoff. Read the notes on the marked cards.',
 pathOrder:'The right eight sit above the line and the later work sits below it. The order inside the path is out of place on the marked cards.',
 pathOk:'The path holds, in the order the moves depend on one another.',
 summary:{
  idle:'Choose a problem and a signal, then check again.',
  some:'Part of the assembly needs another look. Read the notes on each part and check again.',
  all:'The problem, the path and the signal all hold. Each move closes before the one that depends on it opens.'
 },
 initial:['m5','d2','m1','m8','m4','m6','d1','m3','m7','m2','d3'],
 aboveCount:8
};

const MOVES={};COPY.moves.forEach(function(m){MOVES[m.id]=m;});
COPY.distractors.forEach(function(m){MOVES[m.id]=m;});
function isDistractor(id){return id.charAt(0)==='d';}

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}

let order=COPY.initial.slice();
let flags={};   /* path feedback keyed by card id, cleared whenever the order changes */

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.terms.forEach(function(t){$('#terms').appendChild(h('dt',{text:t[0]}));$('#terms').appendChild(h('dd',{text:t[1]}));});
$('#problemLegend').textContent=COPY.problemLegend;
$('#signalLegend').textContent=COPY.signalLegend;
$('#pathNote').textContent=COPY.pathNote;

function radios(host,name,items){
  items.forEach(function(o){
    const inp=h('input',{type:'radio',name:name,value:o.id});
    inp.addEventListener('change',function(){$('#fb-'+name).className='fb';$('#fb-'+name).textContent='';});
    host.appendChild(h('label',{class:'opt'},[inp,h('span',{text:o.text})]));
  });
}
radios($('#problem'),'problem',COPY.problem);
radios($('#signal'),'signal',COPY.signal);

/* The path */
function renderPath(focusSpec){
  const ol=$('#path');
  ol.textContent='';
  order.forEach(function(id,i){
    if(i===COPY.aboveCount){
      const d=h('li',{class:'divider','aria-hidden':'true',text:COPY.handoff});
      ol.appendChild(d);
    }
    const m=MOVES[id];
    const f=flags[id];
    const card=h('li',{class:'pcard'+(f?' '+f.s:''),'data-id':id});
    const zone=(i<COPY.aboveCount)?('Position '+fmt(i+1)+' in the path'):'After the handoff';
    card.appendChild(h('div',null,[
      h('span',{class:'zone',text:zone}),h('br'),
      h('span',{class:'ptitle',text:m.title}),h('br'),
      h('span',{class:'pdesc',text:m.desc})
    ]));
    const up=h('button',{type:'button',class:'btn small','data-mv':id+':up','aria-label':'Move up: '+m.title,text:'Move up'});
    const dn=h('button',{type:'button',class:'btn small','data-mv':id+':down','aria-label':'Move down: '+m.title,text:'Move down'});
    if(i===0)up.disabled=true;
    if(i===order.length-1)dn.disabled=true;
    up.addEventListener('click',function(){move(id,-1);});
    dn.addEventListener('click',function(){move(id,1);});
    card.appendChild(h('div',{class:'mv'},[up,dn]));
    if(f){
      const fb=h('div',{class:'fb '+f.s,role:'status'});
      fb.appendChild(h('span',{class:'chip',text:COPY.chip[f.s]}));
      fb.appendChild(document.createTextNode(f.m));
      card.appendChild(fb);
    }
    ol.appendChild(card);
  });
  if(focusSpec){
    let t=document.querySelector('[data-mv="'+focusSpec+'"]');
    if(t&&t.disabled){
      const other=focusSpec.replace(/:(up|down)$/,function(_,d){return d==='up'?':down':':up';});
      t=document.querySelector('[data-mv="'+other+'"]');
    }
    if(t)t.focus();
  }
}
function move(id,dir){
  const i=order.indexOf(id), j=i+dir;
  if(j<0||j>=order.length)return;
  order[i]=order[j];order[j]=id;
  flags={};
  $('#fb-path').className='fb';$('#fb-path').textContent='';
  renderPath(id+':'+(dir<0?'up':'down'));
  const pos=order.indexOf(id);
  $('#live').textContent=pos<COPY.aboveCount?(MOVES[id].title+' is now at position '+fmt(pos+1)+' in the path.'):(MOVES[id].title+' is now after the handoff.');
}

/* Keys */
function setFb(box,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m));
}
function checkChoice(name,items,first){
  const sel=document.querySelector('input[name='+name+']:checked');
  if(!sel)return {s:'idle',m:'Choose one.'};
  const o=items.filter(function(x){return x.id===sel.value;})[0];
  if(o.ok)return {s:'ok',m:o.okMsg};
  return {s:'bad',m:o.whyNot+' '+first};
}
function checkPath(){
  const above=order.slice(0,COPY.aboveCount);
  const below=order.slice(COPY.aboveCount);
  const f={};
  let setErr=false,orderErr=false;
  above.forEach(function(id){if(isDistractor(id)){f[id]={s:'bad',m:COPY.premature};setErr=true;}});
  below.forEach(function(id){if(!isDistractor(id)){f[id]={s:'bad',m:COPY.belongsAbove};setErr=true;}});
  const pos={};above.forEach(function(id,i){pos[id]=i;});
  COPY.deps.forEach(function(d){
    if(pos[d.before]!==undefined&&pos[d.after]!==undefined&&pos[d.before]>pos[d.after]){
      if(!f[d.after])f[d.after]={s:'near',m:'Out of place. '+d.why};
      orderErr=true;
    }
  });
  let res;
  if(setErr)res={s:'bad',m:COPY.pathSet};
  else if(orderErr)res={s:'near',m:COPY.pathOrder};
  else{
    res={s:'ok',m:COPY.pathOk};
    above.forEach(function(id){f[id]={s:'ok',m:MOVES[id].why};});
    below.forEach(function(id){f[id]={s:'ok',m:COPY.distractorOk};});
  }
  flags=f;
  renderPath(null);
  setFb($('#fb-path'),res);
  return res.s;
}

$('#check').addEventListener('click',function(){
  const p=checkChoice('problem',COPY.problem,COPY.problemFirst);
  setFb($('#fb-problem'),p);
  const pathState=checkPath();
  const s=checkChoice('signal',COPY.signal,COPY.signalFirst);
  setFb($('#fb-signal'),s);
  const allOk=(p.s==='ok'&&pathState==='ok'&&s.s==='ok');
  const anyIdle=(p.s==='idle'||s.s==='idle');
  $('#summary').textContent=allOk?COPY.summary.all:(anyIdle?COPY.summary.idle:COPY.summary.some);
});

renderPath(null);
})();
</script>
</body>
</html>

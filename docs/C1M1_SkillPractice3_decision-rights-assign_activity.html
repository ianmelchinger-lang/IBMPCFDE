<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assign each decision to one accountable authority</title>
<style>
:root{--bg:#f5f3ee;--panel:#ffffff;--ink:#1b2430;--muted:#56616e;--line:#d6d1c5;--soft:#ece8de;--accent:#1d5876;--accent-ink:#ffffff;--accent-soft:#e3eef4;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#0a4fc4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
li{margin:.3rem 0}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.dhead{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.15rem}
.did{font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:.1rem .5rem}
.dtitle{font-size:1.02rem;font-weight:600}
.ddesc{margin:.1rem 0 .6rem;color:var(--muted);font-size:.93rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid #8a8577;border-radius:6px;background:#fff;color:var(--ink);width:100%}
select:disabled{background:var(--soft);color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:.8rem 0 .2rem;padding:8px 12px 10px;background:#faf9f6}
legend{padding:0 .35rem;font-weight:600;font-size:.92rem}
.chk{display:flex;gap:.55rem;align-items:flex-start;padding:.25rem 0;font-weight:400;font-size:.95rem}
.chk input{margin-top:.3rem;width:1.05rem;height:1.05rem;flex:0 0 auto}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.6rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--muted);border-color:#8a8577}
.evnote{margin:.5rem 0 0;font-size:.93rem;color:var(--ink)}
.evnote:empty{display:none}
.unscored{display:inline-block;font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid #8a8577;border-radius:999px;padding:0 .5rem;margin-left:.4rem}
.remits li{margin:.35rem 0}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
.radios label{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem 0;font-weight:400;font-size:1rem}
.radios input{margin-top:.35rem;width:1.05rem;height:1.05rem}
.live{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.live p{margin:.25rem 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.pair{grid-template-columns:1fr}.dhead{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Skill practice</p>
<h1>Assign each decision to one accountable authority</h1>
<p id="lead"></p>
</header>

<section aria-labelledby="h-parts">
<h2 id="h-parts">Four parts you can play</h2>
<dl id="parts"></dl>
</section>

<section aria-labelledby="h-case">
<h2 id="h-case">What the case says</h2>
<ul id="facts"></ul>
<h3 id="remit-h"></h3>
<ul class="remits" id="remits"></ul>
</section>

<section aria-labelledby="h-work">
<h2 id="h-work">Assign the eight decisions</h2>
<p class="hint" id="workNote"></p>
<div id="cards"></div>
<div class="bar"><button type="button" class="btn" id="check">Check my assignments</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
</section>

<section id="second" class="panel" hidden aria-labelledby="h-second">
<h2 id="h-second" style="margin-top:0">Move one assumption</h2>
<p id="secondIntro"></p>
<fieldset class="radios" style="background:#fff">
<legend id="evLegend"></legend>
<label><input type="radio" name="evstate" value="complete" checked><span id="evCompleteLabel"></span></label>
<label><input type="radio" name="evstate" value="missing"><span id="evMissingLabel"></span></label>
</fieldset>
<div class="live" id="liveBox" role="status" aria-live="polite"></div>
</section>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};

/* All copy and keys live in this block. */
const COPY={
 lead:`Every material decision in an engagement has exactly one accountable authority: the role that answers for it. People who do the work contribute to a decision without owning it. For each of eight decisions, choose the accountable authority and say what part you play.`,
 parts:[
  ['accountable','Accountable','Answers for the decision. Exactly one role holds it.'],
  ['recommends','Recommends','Puts a reasoned proposal to the decider.'],
  ['evidence','Supplies evidence','Provides the facts the decider needs.'],
  ['escalates','Escalates','Raises the matter through the agreed route to the decider.']
 ],
 facts:[
  `In this case, the client's governance names the AI review board as the approval body before any AI use goes into production. The board meets every two weeks.`,
  `The funding covers the drafting assistant for North American claims. The chief operating officer of the industrial group, the executive sponsor, approved it. The EU and Asia-Pacific regions are proposed, not funded.`,
  `The model risk and AI governance lead is consulted on risk and on what evidence a governed use must carry. The enterprise architect is consulted on technical design.`
 ],
 remitHead:'Who holds what',
 roles:[
  ['board','AI review board','The body the client\'s governance names to approve a use for production.'],
  ['dir','Claims operations director (sponsor)','Owns the claims operation and its cycle-time outcome. Sponsors the engagement.'],
  ['mrg','Model risk and AI governance lead','Sets what evidence a governed use must carry and advises on its risk.'],
  ['plat','AI platform owner','Runs the platform the assistant sits on.'],
  ['rel','Release and change manager','Schedules and controls releases and changes to production.'],
  ['stew','Data steward, policy and claims data','Decides who may read policy and claims data.'],
  ['iam','Identity and access lead','Grants and removes access once it has been decided.'],
  ['cooi','Chief operating officer, industrial group (executive sponsor)','Approved the funding for the drafting assistant on North American claims.'],
  ['arch','Enterprise architect','Sets how the subsidiary\'s systems fit together.'],
  ['eng','You, the engineer','Builds and hands over, then leaves when the engagement ends.']
 ],
 workNote:'Choose both selections for every decision, then check. The evidence lists under two decisions are not checked: nothing there has a single right answer. Nothing is timed.',
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 msg:{
  idle:'Choose an accountable authority and your part.',
  two:'That puts two accountable authorities on one decision. Each decision has exactly one. If another role is accountable, your part is something else.',
  engPart:'If you are the accountable authority, your part is accountable. Check the two selections against each other.',
  nearRole:'Your part is right. The accountable authority is out of place. ',
  nearPart:'The accountable authority is right. Your part is out of place. ',
  nearBoth:'You contribute without owning the decision, which is right. The kind of contribution is out of place: ask whether the decider must weigh an option you propose, or examine facts you supply.',
  partFirst:'Ask what you can do without owning the decision: propose an option, provide the facts, raise it through the agreed route, or answer for it. Answering for it belongs to one role only.',
  roleFirst:function(type){return 'First move: name what kind of decision this is ('+type+'), then find the remit above that covers that kind.';}
 },
 summary:{
  idle:'Choose both selections for every decision, then check again.',
  some:'Some decisions need another look. Read the notes on the marked decisions, change your choices and check again.',
  all:'Every decision has one accountable authority, and your part is clear on each.'
 },
 ev1:{
  legend:'Evidence the decider needs. Not checked.',
  note:`The governance record is the file the client keeps on each AI use. Its required fields are fixed.`,
  fields:['Purpose','Data sources','Model record','Evaluation results','Human-review design','Monitoring plan','Accountable owner','Retirement criteria'],
  extras:['The go-live date','The count of adjusters trained','The pilot\'s touch-time result']
 },
 ev4:{
  legend:'Evidence the decider needs. Not checked.',
  options:[
   ['claims','Claim records for the agreed period, showing the time from receipt to determination'],
   ['resp','The platform\'s response-time report'],
   ['train','The count of adjusters trained'],
   ['live','The go-live date']
  ]
 },
 second:{
  intro:'Hold the assignments above fixed and move one fact: whether the evidence the review board has asked for is in hand. The decision in front of you changes.',
  legend:'The review board has asked for its evidence. That evidence is',
  complete:'complete',
  missing:'missing',
  closeMissing:'Authorizing production cannot proceed on an incomplete record, and delivery does not stand in for the board\'s decision. Nobody in this case holds a decision to proceed and note the gap.'
 }
};

/* Decisions. roles is the keyed accountable set; part is the engineer's keyed part. */
const D=[
 {id:'D1',title:'Authorize production',desc:'Approve the assistant for live use on real claims.',type:'approval before production',roles:['board'],part:'evidence',ev:'ev1',
  why:`The client's governance names the AI review board as the approval body. Building the system confers no power to approve it, so you supply the evidence the board needs.`},
 {id:'D2',title:'Accept residual risk',desc:'Accept the risk that remains after controls are in place.',type:'risk acceptance',roles:['dir'],part:'evidence',
  why:'The role that owns the operation carrying the risk accepts it. The model risk and AI governance lead is consulted, which is a different part from being accountable. You supply evidence.'},
 {id:'D3',title:'Grant access to policy and claims data',desc:'Decide that the assistant may read the data it needs.',type:'data access',roles:['stew'],part:'recommends',
  why:'The data steward decides who may read this data. The identity and access lead grants access once it is decided. You recommend what access the design needs.'},
 {id:'D4',title:'Accept the outcome',desc:'Decide that the funded result has been reached.',type:'outcome acceptance',roles:['dir'],part:'evidence',ev:'ev4',
  why:`The sponsor owns the outcome, so the sponsor accepts it. You supply the evidence from the client's claim records.`},
 {id:'D5',title:'Extend to a second North American line',desc:'Widen the assistant to another product line within North American claims.',type:'change of scope within the funding',roles:['dir'],part:'recommends',
  why:'The extension stays inside the funded scope, which the sponsor holds. Funding beyond that scope sits with the executive sponsor. You recommend.'},
 {id:'D6',title:'Hold a release when evidence is missing',desc:'Stop a release from going out because required evidence is absent.',type:'release hold',roles:['plat','rel'],part:'escalates',
  why:'The hold rests with a role that controls the release. You surface the missing evidence and invoke the agreed escalation or hold process.'},
 {id:'D7',title:'Recommend the integration approach',desc:'Propose how the assistant connects to the systems of record.',type:'technical recommendation',roles:['eng'],part:'accountable',
  why:'A technical recommendation is your work product, so you answer for it. The enterprise architect is consulted, which is a different part from being accountable.'},
 {id:'D8',title:'Fund an EU extension',desc:'Pay for the assistant to operate on European claims.',type:'funding',roles:['cooi'],part:'recommends',
  why:'The EU is proposed, not funded. Funding sits with the executive sponsor who approved the original funding. You recommend, with the technical case.'}
];

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}
function roleName(id){return COPY.roles.filter(function(r){return r[0]===id;})[0][1];}
function partName(id){return COPY.parts.filter(function(p){return p[0]===id;})[0][1];}

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.parts.forEach(function(p){$('#parts').appendChild(h('dt',{text:p[1]}));$('#parts').appendChild(h('dd',{text:p[2]}));});
COPY.facts.forEach(function(t){$('#facts').appendChild(h('li',{text:t}));});
$('#remit-h').textContent=COPY.remitHead;
COPY.roles.forEach(function(r){$('#remits').appendChild(h('li',null,[h('strong',{text:r[1]+'. '}),r[2]]));});
$('#workNote').textContent=COPY.workNote;
$('#secondIntro').textContent=COPY.second.intro;
$('#evLegend').textContent=COPY.second.legend;
$('#evCompleteLabel').textContent=COPY.second.complete;
$('#evMissingLabel').textContent=COPY.second.missing;

/* Cards */
function checkbox(name,value,text,onchange){
  const inp=h('input',{type:'checkbox',name:name,value:value});
  inp.addEventListener('change',onchange);
  return h('label',{class:'chk'},[inp,h('span',{text:text})]);
}
function evidenceBlock(d){
  const fs=h('fieldset');
  const lg=h('legend',{text:COPY[d.ev].legend});
  fs.appendChild(lg);
  const note=h('p',{class:'evnote',id:'evnote-'+d.id,role:'status','aria-live':'polite'});
  if(d.ev==='ev1'){
    fs.appendChild(h('p',{class:'hint',text:COPY.ev1.note}));
    COPY.ev1.fields.concat(COPY.ev1.extras).forEach(function(t,i){
      fs.appendChild(checkbox('ev-'+d.id,String(i),t,function(){updateEv1(d.id);}));
    });
  }else{
    COPY.ev4.options.forEach(function(o){
      fs.appendChild(checkbox('ev-'+d.id,o[0],o[1],function(){updateEv4(d.id);}));
    });
  }
  fs.appendChild(note);
  return fs;
}
function picked(id){
  return Array.prototype.map.call(document.querySelectorAll('input[name="ev-'+id+'"]:checked'),function(x){return x.value;});
}
function updateEv1(id){
  const sel=picked(id).map(Number);
  const nReq=COPY.ev1.fields.length;
  const missing=COPY.ev1.fields.filter(function(_,i){return sel.indexOf(i)===-1;});
  const extras=COPY.ev1.extras.filter(function(_,i){return sel.indexOf(nReq+i)>-1;});
  let t=`The governance record has ${fmt(nReq)} required fields. `;
  t+=missing.length?`Your selection leaves out: ${missing.join(', ').toLowerCase()}. A record missing a required field is incomplete.`:'Your selection covers every required field.';
  if(extras.length)t+=` You also selected: ${extras.join(', ').toLowerCase()}. These may support a recommendation, but the record does not require them.`;
  $('#evnote-'+id).textContent=t;
}
function updateEv4(id){
  const sel=picked(id);
  let t=`The outcome statement the sponsor owns names one evidence source: the client's claim records. `;
  t+=sel.indexOf('claims')>-1?'Your selection includes them.':'Your selection leaves them out.';
  if(sel.some(function(v){return v!=='claims';}))t+=' The other items you chose describe delivery or system performance, which is not what the sponsor accepts.';
  $('#evnote-'+id).textContent=t;
}

D.forEach(function(d){
  const card=h('article',{class:'card',id:'card-'+d.id});
  card.appendChild(h('div',{class:'dhead'},[h('span',{class:'did',text:d.id}),h('span',{class:'dtitle',text:d.title})]));
  card.appendChild(h('p',{class:'ddesc',text:d.desc}));
  const role=h('select',{id:'role-'+d.id});
  role.appendChild(option('','Choose a role'));
  COPY.roles.forEach(function(r){role.appendChild(option(r[0],r[1]));});
  const part=h('select',{id:'part-'+d.id});
  part.appendChild(option('','Choose your part'));
  COPY.parts.forEach(function(p){part.appendChild(option(p[0],p[1]));});
  card.appendChild(h('div',{class:'pair'},[
    h('div',{class:'field'},[h('label',{for:'role-'+d.id,text:'Accountable authority'}),role]),
    h('div',{class:'field'},[h('label',{for:'part-'+d.id,text:'Your part'}),part])
  ]));
  if(d.ev)card.appendChild(evidenceBlock(d));
  card.appendChild(h('div',{class:'fb',id:'fb-'+d.id,role:'status','aria-live':'polite'}));
  $('#cards').appendChild(card);
});

/* Keys */
function decisionState(selRole,selPart,key){
  if(!selRole||!selPart)return {s:'idle',m:COPY.msg.idle};
  if(selPart==='accountable'&&selRole!=='eng')return {s:'bad',m:COPY.msg.two};
  if(selRole==='eng'&&selPart!=='accountable')return {s:'bad',m:COPY.msg.engPart};
  const roleOk=key.roles.indexOf(selRole)>-1;
  const partOk=selPart===key.part;
  if(roleOk&&partOk)return {s:'ok',m:key.why};
  const pair=['recommends','evidence'];
  const partNear=pair.indexOf(selPart)>-1&&pair.indexOf(key.part)>-1;
  const partMsg=partNear?COPY.msg.nearBoth:COPY.msg.partFirst;
  if(roleOk&&!partOk)return {s:'near',m:COPY.msg.nearPart+partMsg};
  if(!roleOk&&partOk)return {s:'near',m:COPY.msg.nearRole+COPY.msg.roleFirst(key.type)};
  return {s:'bad',m:COPY.msg.roleFirst(key.type)+' '+partMsg};
}
function showFb(box,cardEl,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  if(cardEl)cardEl.className='card '+(res.s==='idle'?'':res.s);
}

$('#check').addEventListener('click',function(){
  let all=true,anyIdle=false;
  D.forEach(function(d){
    const r=decisionState($('#role-'+d.id).value,$('#part-'+d.id).value,d);
    showFb($('#fb-'+d.id),$('#card-'+d.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    D.forEach(function(d){$('#role-'+d.id).disabled=true;$('#part-'+d.id).disabled=true;});
    $('#summary').textContent=COPY.summary.all;
    $('#check').hidden=true;
    $('#second').hidden=false;
    renderLive();
  }else{
    $('#summary').textContent=anyIdle?COPY.summary.idle:COPY.summary.some;
  }
});

/* Second pass: the same decisions with one fact moved */
function names(key){return key.roles.map(roleName).join(' or ');}
function renderLive(){
  const state=document.querySelector('input[name=evstate]:checked').value;
  const box=$('#liveBox');
  box.textContent='';
  const key=(state==='complete')?D[0]:D[5];
  box.appendChild(h('p',null,[h('strong',{text:'The live decision: '}),key.title+'.']));
  box.appendChild(h('p',null,[h('strong',{text:'Who decides: '}),names(key)+'.']));
  box.appendChild(h('p',null,[h('strong',{text:'Your part: '}),partName(key.part)+'.']));
  box.appendChild(h('p',{class:'hint',text:key.why}));
  if(state==='missing')box.appendChild(h('p',{text:COPY.second.closeMissing}));
}
document.querySelectorAll('input[name=evstate]').forEach(function(r){r.addEventListener('change',renderLive);});
})();
</script>
</body>
</html>

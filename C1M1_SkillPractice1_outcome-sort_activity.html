<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separate outputs, system measures and outcome measures</title>
<style>
:root{--bg:#f5f3ee;--panel:#ffffff;--ink:#1b2430;--muted:#56616e;--line:#d6d1c5;--soft:#ece8de;--accent:#1d5876;--accent-ink:#ffffff;--accent-soft:#e3eef4;--ok:#17653a;--ok-bg:#e4f2ea;--near:#744900;--near-bg:#fbefd6;--bad:#92282a;--bad-bg:#f8e3e1;--mark:#fff0b3;--focus:#0a4fc4}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 56px}
.kicker{margin:0 0 .3rem;color:var(--muted);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
h1{margin:0 0 .6rem;font:600 1.6rem/1.25 Georgia,"Times New Roman",serif}
h2{margin:1.8rem 0 .5rem;font:600 1.18rem/1.3 Georgia,"Times New Roman",serif}
h3{margin:0 0 .35rem;font-size:1rem;font-weight:600}
p{margin:.4rem 0 .8rem}
ul{margin:.4rem 0 .8rem;padding-left:1.2rem}
li{margin:.3rem 0}
dl{margin:.4rem 0 .8rem}
dt{font-weight:600;margin-top:.5rem}
dd{margin:0 0 .2rem}
.hint{color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card .lab{display:inline-block;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.2rem}
.stmt{margin:.2rem 0 .7rem;font-size:1.02rem}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;margin:.4rem 0}
.ctl label{font-weight:600;font-size:.92rem;min-width:9.5rem}
select{font:inherit;font-size:.95rem;padding:.45rem .5rem;border:1px solid #8a8577;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
select:disabled{background:var(--soft);color:var(--muted)}
.btn{font:inherit;font-weight:600;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.secondary{background:#fff;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;padding:.08rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;margin-right:.45rem;border:1px solid transparent}
.fb{margin-top:.5rem;font-size:.95rem}
.fb:empty{display:none}
.fb.ok .chip{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.fb.near .chip{background:var(--near-bg);color:var(--near);border-color:var(--near)}
.fb.bad .chip{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.idle .chip{background:var(--soft);color:var(--muted);border-color:#8a8577}
.card.ok{border-left:5px solid var(--ok)}
.card.near{border-left:5px solid var(--near)}
.card.bad{border-left:5px solid var(--bad)}
.bar{margin:14px 0 4px}
.summary{font-weight:600;min-height:1.5rem}
mark{background:var(--mark);color:var(--ink);padding:0 .15rem;border-radius:3px}
#second .btn{margin:.3rem .5rem .3rem 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.wrap{padding:16px 12px 40px}h1{font-size:1.35rem}.ctl label{min-width:0;width:100%}.ctl select{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="kicker">Skill practice</p>
<h1>Separate outputs, system measures and outcome measures</h1>
<p id="lead"></p>
</header>

<section aria-labelledby="h-terms">
<h2 id="h-terms">Three kinds of success statement</h2>
<dl id="defs"></dl>
<div class="panel">
<h3 id="five-h"></h3>
<ul id="five"></ul>
</div>
</section>

<section aria-labelledby="h-work">
<h2 id="h-work">Sort the ten statements</h2>
<p id="phaseNote" class="hint"></p>
<div id="cards"></div>
<div class="bar"><button type="button" class="btn" id="check">Check my sorting</button></div>
<p id="summary" class="summary" role="status" aria-live="polite"></p>
</section>

<section id="second" class="panel" hidden aria-labelledby="h-second">
<h2 id="h-second" style="margin-top:0">Move one assumption</h2>
<p id="secondIntro"></p>
<button type="button" class="btn secondary" id="swap"></button>
<button type="button" class="btn secondary" id="restore" hidden>Restore the original evidence</button>
<p id="restoreNote" class="hint" role="status" aria-live="polite"></p>
<div id="vcard" class="card" hidden>
<span class="lab">The same statement, one change</span>
<p class="stmt" id="vstmt"></p>
<div class="ctl"><label for="vcat">Category</label><select id="vcat"></select></div>
<div class="bar"><button type="button" class="btn" id="vcheck">Check this placement</button></div>
<div class="fb" id="vfb" role="status" aria-live="polite"></div>
</div>
</section>
</main>

<script>
(function(){
'use strict';
const fmt=function(n,d){return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};
const T=fmt(5,1);   /* the one number the statements may carry: the sponsor's cycle-time target, in days */

/* All copy and keys live in this block. */
const COPY={
 lead:`The engagement is funded to change how the claims operation performs: the time from receipt of a claim to its determination. A statement of success can report three different things, and only one of them shows that change. Sort each statement by what it reports.`,
 defs:[
  ['Output','Something the team delivers, such as an integration or a training session.'],
  ['System measure','A reading of how the technology performs, such as how quickly it responds.'],
  ['Outcome measure','A measure taken in the client\'s operation that shows what changed there.']
 ],
 fiveHead:'A complete outcome statement answers five questions',
 five:[
  ['Subject','What changes?'],
  ['Direction','Which way does it move, or toward what target?'],
  ['Evidence','Which operational records show it?'],
  ['Owner','Which client role is accountable for the measure?'],
  ['Period','When does the client examine it?']
 ],
 notes:{
  sort:'Choose a category for each statement, then check. Nothing is timed.',
  tag:'Every statement now sits in the right category. For each outcome statement, mark which element it lacks, or mark it complete if nothing is missing.',
  done:'The tags hold. Nothing further is required here.'
 },
 cats:[['output','Output'],['system','System measure'],['outcome','Outcome measure']],
 elements:[['subject','Subject'],['direction','Direction'],['evidence','Evidence'],['owner','Owner'],['period','Period']],
 sortNear:'The first cut is right: this belongs with the technology side, which covers what the team delivers and how the system performs. The choice between output and system measure is out of place. Ask whether it is something handed over or a reading of how the system performs.',
 sortBad:`First move: ask where the change would show up. It could appear in what the team handed over, in the platform's own readings, or in the client's claims operation. The three categories follow those three places.`,
 tagNear:'Something is missing, which is right, but it is a different element. Read the statement against the five questions, one at a time, and find the question that no phrase answers.',
 tagBad:'Read the statement against the five questions, one at a time. Mark an element missing only when no phrase in the sentence answers its question. Mark the statement complete only when every question has an answer.',
 chip:{ok:'Correct',near:'Close',bad:'Look again',idle:'Not yet chosen'},
 summarySort:{
  idle:'Choose a category for every statement, then check again.',
  some:'Some placements need another look. Read the notes on the marked statements, change your choices and check again.',
  all:'Every statement sits in the right category.'
 },
 summaryTag:{
  idle:'Choose a tag for every outcome statement, then check again.',
  some:'Some tags need another look. Read the notes on the marked statements, change your choices and check again.',
  all:'Every tag holds. One outcome statement is complete on all five elements, and each of the others lacks exactly one.'
 },
 second:{
  intro:'The complete statement keeps its subject, direction, owner and period. Change only where its evidence comes from, then decide where the statement belongs.',
  swap:'Use the assistant\'s own usage logs as the evidence',
  restoreNote:'Restored. With the client\'s claim records as the evidence, the statement is an outcome measure again.',
  idleMsg:'Choose a category for the changed statement.',
  near:'The technology side is right, which is the main cut. Ask whether the statement now reports something handed over or a reading of how the system performs.',
  bad:'The wording is the same, so ask what changed. Where would the evidence come from now: the team\'s delivery, the platform\'s own readings, or the client\'s operation?',
  ok:'The subject, direction, owner and period are unchanged. The evidence now comes from the assistant\'s own logs, which record what the assistant did, not what happened to claims. Evidence taken from the system describes the system, so the statement is a system measure. The category follows the evidence, not the wording.'
 }
};

/* The ten statements. cat is the keyed category. lacks is the keyed missing element, or null when the statement is complete. */
const S=[
 {id:'s1',label:'A',cat:'outcome',lacks:'period',
  text:`Reduce the time from claim receipt to determination toward ${T} calendar days, as the client's claim records show it, with the claims operations director accountable.`,
  sortWhy:`Outcome measure. It describes what happens to claims in the client's operation, shown by the client's claim records.`,
  tagWhy:'Correct. Nothing says when the client will examine the measure.'},
 {id:'s2',label:'B',cat:'output',lacks:null,
  text:'The drafting assistant goes live for North American claims.',
  sortWhy:'Output. Going live is something the team delivers. It does not show that anything changed in the operation.'},
 {id:'s3',label:'C',cat:'system',lacks:null,
  text:'The assistant returns each draft within the response time the platform team has agreed.',
  sortWhy:'System measure. It describes how the technology performs, and the platform team reads it.'},
 {id:'s4',label:'D',cat:'outcome',lacks:null,
  text:`Reduce the time from claim receipt to determination toward ${T} calendar days during the first full quarter after launch, as the client's claim records show it, with the claims operations director accountable.`,
  sortWhy:`Outcome measure. It describes what happens to claims in the client's operation, shown by the client's claim records.`,
  tagWhy:'Correct. Subject, direction, evidence, owner and period are all present.'},
 {id:'s5',label:'E',cat:'output',lacks:null,
  text:`Claims desk supervisors and adjusters finish training on how to review the assistant's drafts.`,
  sortWhy:'Output. Training is something the team delivers. It says nothing about what changed in the operation.'},
 {id:'s6',label:'F',cat:'outcome',lacks:'owner',
  text:`Reduce the time from claim receipt to determination during the first full quarter after launch, as the client's claim records show it.`,
  sortWhy:`Outcome measure. It describes what happens to claims in the client's operation, shown by the client's claim records.`,
  tagWhy:'Correct. The statement names no client role as accountable for the measure.'},
 {id:'s7',label:'G',cat:'system',lacks:null,
  text:`Each draft cites a provision that was in force on the date of the loss, as the platform's citation monitor reports.`,
  sortWhy:`System measure. The platform's own monitor produces it, so it describes the system, not what happened to claims.`},
 {id:'s8',label:'H',cat:'outcome',lacks:'direction',
  text:`Time from claim receipt to determination, as the client's claim records show it each quarter after launch, with the claims operations director accountable.`,
  sortWhy:`Outcome measure. It describes what happens to claims in the client's operation, shown by the client's claim records.`,
  tagWhy:'Correct. The statement names a measure but not which way it should move.'},
 {id:'s9',label:'I',cat:'output',lacks:null,
  text:'The assistant is connected to the policy data and the claims data it reads.',
  sortWhy:'Output. A connection is something the team delivers.'},
 {id:'s10',label:'J',cat:'outcome',lacks:'evidence',
  text:`Reduce the time from claim receipt to determination toward ${T} calendar days during the first full quarter after launch, with the claims operations director accountable.`,
  sortWhy:`Outcome measure. Its subject is what happens to claims in the operation, even though the statement does not yet say which records show it.`,
  tagWhy:'Correct. A target says where the measure should go. It does not say which records show it.'}
];

/* The moved assumption: statement D with its evidence swapped. */
const VARIANT={
 cat:'system',
 mark:`the assistant's own usage logs record it`,
 text:`Reduce the time from claim receipt to determination toward ${T} calendar days during the first full quarter after launch, as the assistant's own usage logs record it, with the claims operations director accountable.`
};

const $=function(s,r){return (r||document).querySelector(s);};
function h(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='class')e.className=attrs[k];
    else if(k==='text')e.textContent=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });}
  (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function option(v,t){return h('option',{value:v,text:t});}

let phase='sort';   /* sort, tag, done */

/* Static content */
$('#lead').textContent=COPY.lead;
COPY.defs.forEach(function(d){$('#defs').appendChild(h('dt',{text:d[0]}));$('#defs').appendChild(h('dd',{text:d[1]}));});
$('#five-h').textContent=COPY.fiveHead;
COPY.five.forEach(function(f){$('#five').appendChild(h('li',null,[h('strong',{text:f[0]+': '}),f[1]]));});
$('#phaseNote').textContent=COPY.notes.sort;
$('#secondIntro').textContent=COPY.second.intro;
$('#swap').textContent=COPY.second.swap;

/* Cards */
function catSelect(id){
  const sel=h('select',{id:id});
  sel.appendChild(option('','Choose a category'));
  COPY.cats.forEach(function(c){sel.appendChild(option(c[0],c[1]));});
  return sel;
}
function tagSelect(id){
  const sel=h('select',{id:id});
  sel.appendChild(option('','Choose'));
  sel.appendChild(option('none','Nothing is missing: it is complete'));
  COPY.elements.forEach(function(e){sel.appendChild(option(e[0],'It lacks the '+e[1].toLowerCase()));});
  return sel;
}
S.forEach(function(s){
  const card=h('article',{class:'card',id:'card-'+s.id});
  card.appendChild(h('span',{class:'lab',text:'Statement '+s.label}));
  card.appendChild(h('p',{class:'stmt',id:'stmt-'+s.id,text:s.text}));
  card.appendChild(h('div',{class:'ctl'},[h('label',{for:'cat-'+s.id,text:'Category'}),catSelect('cat-'+s.id)]));
  const tagRow=h('div',{class:'ctl',id:'tagrow-'+s.id},[h('label',{for:'tag-'+s.id,text:'What is missing?'}),tagSelect('tag-'+s.id)]);
  tagRow.hidden=true;
  card.appendChild(tagRow);
  card.appendChild(h('div',{class:'fb',id:'fb-'+s.id,role:'status','aria-live':'polite'}));
  $('#cards').appendChild(card);
});
$('#vcat').appendChild(option('','Choose a category'));
COPY.cats.forEach(function(c){$('#vcat').appendChild(option(c[0],c[1]));});

/* Feedback */
function showFb(box,cardEl,res){
  box.className='fb '+res.s;
  box.textContent='';
  box.appendChild(h('span',{class:'chip',text:COPY.chip[res.s]}));
  box.appendChild(document.createTextNode(res.m||''));
  if(cardEl){cardEl.className='card '+(res.s==='idle'?'':res.s);}
}

/* Keys */
function techSide(c){return c==='output'||c==='system';}
function sortState(sel,key,okMsg){
  if(!sel)return {s:'idle',m:'Choose a category for this statement.'};
  if(sel===key)return {s:'ok',m:okMsg};
  if(techSide(sel)&&techSide(key))return {s:'near',m:COPY.sortNear};
  return {s:'bad',m:COPY.sortBad};
}
function tagState(sel,lacks,okMsg){
  if(!sel)return {s:'idle',m:'Choose what is missing, or mark the statement complete.'};
  const key=lacks||'none';
  if(sel===key)return {s:'ok',m:okMsg};
  if(lacks&&sel!=='none')return {s:'near',m:COPY.tagNear};
  return {s:'bad',m:COPY.tagBad};
}

function setSummary(t){$('#summary').textContent=t;}

function checkSort(){
  let all=true,anyIdle=false;
  S.forEach(function(s){
    const sel=$('#cat-'+s.id).value;
    const r=sortState(sel,s.cat,s.sortWhy);
    showFb($('#fb-'+s.id),$('#card-'+s.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    phase='tag';
    S.forEach(function(s){
      $('#cat-'+s.id).disabled=true;
      if(s.cat==='outcome'){$('#tagrow-'+s.id).hidden=false;}
      showFb($('#fb-'+s.id),$('#card-'+s.id),{s:'ok',m:s.sortWhy});
    });
    $('#phaseNote').textContent=COPY.notes.tag;
    $('#check').textContent='Check my tags';
    setSummary(COPY.summarySort.all);
  }else{
    setSummary(anyIdle?COPY.summarySort.idle:COPY.summarySort.some);
  }
}

function checkTags(){
  let all=true,anyIdle=false;
  S.forEach(function(s){
    if(s.cat!=='outcome')return;
    const sel=$('#tag-'+s.id).value;
    const r=tagState(sel,s.lacks,s.tagWhy);
    showFb($('#fb-'+s.id),$('#card-'+s.id),r);
    if(r.s==='idle')anyIdle=true;
    if(r.s!=='ok')all=false;
  });
  if(all){
    phase='done';
    S.forEach(function(s){if(s.cat==='outcome')$('#tag-'+s.id).disabled=true;});
    $('#phaseNote').textContent=COPY.notes.done;
    $('#check').hidden=true;
    $('#second').hidden=false;
    setSummary(COPY.summaryTag.all);
  }else{
    setSummary(anyIdle?COPY.summaryTag.idle:COPY.summaryTag.some);
  }
}

$('#check').addEventListener('click',function(){
  if(phase==='sort')checkSort();
  else if(phase==='tag')checkTags();
});

/* Second pass: same instrument, one assumption moved */
function setVariantText(){
  const p=$('#vstmt');
  p.textContent='';
  const i=VARIANT.text.indexOf(VARIANT.mark);
  p.appendChild(document.createTextNode(VARIANT.text.slice(0,i)));
  p.appendChild(h('mark',{text:VARIANT.mark}));
  p.appendChild(document.createTextNode(VARIANT.text.slice(i+VARIANT.mark.length)));
}
$('#swap').addEventListener('click',function(){
  setVariantText();
  $('#restoreNote').textContent='';
  $('#vcat').value='';
  $('#vcat').disabled=false;
  $('#vcheck').disabled=false;
  $('#vfb').className='fb';
  $('#vfb').textContent='';
  $('#vcard').hidden=false;
  $('#swap').hidden=true;
  $('#restore').hidden=false;
  $('#vcat').focus();
});
$('#vcheck').addEventListener('click',function(){
  const sel=$('#vcat').value;
  let r;
  if(!sel)r={s:'idle',m:COPY.second.idleMsg};
  else if(sel===VARIANT.cat)r={s:'ok',m:COPY.second.ok};
  else if(techSide(sel))r={s:'near',m:COPY.second.near};
  else r={s:'bad',m:COPY.second.bad};
  showFb($('#vfb'),null,r);
  if(r.s==='ok'){$('#vcat').disabled=true;$('#vcheck').disabled=true;}
});
$('#restore').addEventListener('click',function(){
  $('#vcard').hidden=true;
  $('#restore').hidden=true;
  $('#swap').hidden=false;
  $('#restoreNote').textContent=COPY.second.restoreNote;
  $('#swap').focus();
});
})();
</script>
</body>
</html>
